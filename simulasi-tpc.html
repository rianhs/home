<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi Angka Lempeng Total (TPC) pada Daging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light dark;
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1D1D1F; --muted:#6E6E73; --line:rgba(60,60,67,.13);
  --fill:rgba(118,118,128,.12); --nav:rgba(242,242,247,.82); --navfade:rgba(242,242,247,.96);
  --accent:#0071E3; --accent-soft:rgba(0,113,227,.10);
  --green:#248A3D; --green-soft:rgba(52,199,89,.14);
  --orange:#B25000; --orange-soft:rgba(255,149,0,.14);
  --red:#D70015; --red-soft:rgba(255,59,48,.11);
  --agar:#E9D3A0;
  --bpw:rgba(226,206,150,.4); --glass:rgba(60,60,67,.5); --bin:#C4CAD3; --binrim:#A3ABB7;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000; --card:#1C1C1E; --text:#F5F5F7; --muted:#98989F; --line:rgba(84,84,88,.55);
    --fill:rgba(118,118,128,.24); --nav:rgba(22,22,24,.82); --navfade:rgba(22,22,24,.96);
    --accent:#2997FF; --accent-soft:rgba(41,151,255,.18);
    --green:#30D158; --green-soft:rgba(48,209,88,.16);
    --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.16);
    --red:#FF453A; --red-soft:rgba(255,69,58,.16);
    --shadow:none;
    --bpw:rgba(226,206,150,.3); --glass:rgba(235,235,245,.45); --bin:#48484A; --binrim:#636366;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","tnum"}
body.nosc{overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Navigasi atas */
.nav{position:sticky;top:0;z-index:20;background:var(--nav);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);padding-top:env(safe-area-inset-top)}
.nav-inner{max-width:780px;margin:0 auto;padding:10px 20px 10px}
.nav-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:600;font-size:15px;line-height:1.3}
.brand small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:15px;cursor:pointer;padding:6px 0}
.progress{height:3px;background:var(--fill);border-radius:3px;margin-top:10px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .4s}
.steps-wrap{position:relative;margin-top:10px}
.steps-wrap::before,.steps-wrap::after{content:"";position:absolute;top:0;bottom:0;width:32px;z-index:2;pointer-events:none;opacity:0;transition:opacity .2s}
.steps-wrap::before{left:0;background:linear-gradient(to right,var(--navfade),transparent)}
.steps-wrap::after{right:0;background:linear-gradient(to left,var(--navfade),transparent)}
.steps-wrap.fl::before,.steps-wrap.fr::after{opacity:1}
.steps{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;cursor:grab;touch-action:pan-x;-webkit-overflow-scrolling:touch}
.steps::-webkit-scrollbar{display:none}
.steps.drag{cursor:grabbing;user-select:none;-webkit-user-select:none}
.pill{flex:none;border:0;background:var(--fill);color:var(--muted);font-size:13px;font-weight:500;
  padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.pill.done{color:var(--text)}
.pill.active{background:var(--accent);color:#fff}
.pill:disabled{opacity:.4;cursor:default}

main{max-width:780px;margin:0 auto;padding:28px 20px 130px}
.kicker{font-size:14px;color:var(--muted);margin:0 0 4px}
h1{font-size:32px;line-height:1.15;letter-spacing:-.022em;margin:0 0 10px;font-weight:700}
h2{font-size:19px;letter-spacing:-.012em;margin:0 0 6px;font-weight:600}
h3{font-size:16px;margin:0 0 4px;font-weight:600}
p{margin:0 0 10px}
.lead{color:var(--muted);font-size:17px;margin:0 0 22px;max-width:62ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.sect{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:22px 0 10px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin:0 0 14px}
.card.locked{opacity:.45;pointer-events:none}
.card .sub{color:var(--muted);font-size:15px;margin-bottom:14px}
.step-no{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--fill);font-size:13px;font-weight:600;
  align-items:center;justify-content:center;margin-right:8px;vertical-align:1px}
.card.complete .step-no{background:var(--green);color:#fff}
.clean{margin:0;padding-left:20px}
.clean li{margin:4px 0}

.note{border-radius:14px;padding:14px 16px;margin:12px 0;font-size:15px;background:var(--accent-soft)}
.note.warn{background:var(--orange-soft)}
.note.ok{background:var(--green-soft)}
.note.bad{background:var(--red-soft)}
.note strong{display:block;margin-bottom:4px}
.note p:last-child{margin:0}
.note:empty{display:none}
.hygiene{background:var(--card);border-radius:18px;padding:20px;margin:0 0 14px;box-shadow:var(--shadow)}

.btn{appearance:none;border:0;border-radius:12px;font-weight:600;font-size:16px;padding:12px 18px;cursor:pointer;
  background:var(--accent);color:#fff;transition:transform .1s,opacity .2s;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.tint{background:var(--accent-soft);color:var(--accent)}
.btn.gray{background:var(--fill);color:var(--text)}
.btn.sm{font-size:14px;padding:8px 13px;border-radius:10px}
.btn.on{background:var(--accent);color:#fff}
.btn.ico{padding:8px 14px;font-size:18px;line-height:1}
.btn.grow{flex:1}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.mt{margin-top:14px}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;font-size:14px;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer;color:var(--text)}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.14)}

/* Akordeon */
.acc{border-top:.5px solid var(--line)}
.acc>summary{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:600;font-size:16px;cursor:pointer;list-style:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"";flex:none;width:12px;height:12px;margin:-5px 6px 0 0;box-sizing:border-box;
  border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);border-radius:1px;
  transform:rotate(45deg);transition:transform .2s,margin .2s}
.acc[open]>summary::after{transform:rotate(225deg);margin:5px 6px 0 0}
.acc .accbody{padding:0 0 14px}
.acc .accbody p{margin:0 0 10px;font-size:15px;color:var(--text)}
.acc .accbody p.muted{color:var(--muted)}
.acc .accbody ul{margin:0 0 10px}

/* Beranda */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 14px}
.stats div{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.stats b{display:block;font-size:16px;font-weight:600}
.stats span{font-size:13px;color:var(--muted)}

/* Alat dan bahan */
.calc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.calc{background:var(--fill);border-radius:14px;padding:14px}
.calc span{font-size:13px;color:var(--muted);display:block}
.calc b{font-size:22px;font-weight:600;letter-spacing:-.01em;display:block;margin:2px 0}
.calc small{font-size:13px;color:var(--muted);line-height:1.4;display:block}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;padding:3px}
.stepper button{border:0;background:var(--card);width:30px;height:30px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--text)}
.stepper span{min-width:74px;text-align:center;font-size:14px;font-weight:500}
.group-title{font-size:13px;color:var(--muted);margin:16px 0 6px}
.list{border-radius:14px;background:var(--fill);overflow:hidden}
.item{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-bottom:.5px solid var(--line)}
.item:last-child{border-bottom:0}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);background:transparent;cursor:pointer;
  color:transparent;font-size:14px;line-height:1;margin-top:1px;display:flex;align-items:center;justify-content:center;padding:0}
.item.on .chk{background:var(--green);border-color:var(--green);color:#fff}
.item details{flex:1;min-width:0}
.item summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.item summary::-webkit-details-marker{display:none}
.item summary span{font-weight:500}
.item summary em{font-style:normal;color:var(--muted);font-size:14px}
.item details p{margin:6px 0 2px;font-size:14px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tool{flex:1 1 220px;background:var(--fill);border-radius:12px;padding:10px 12px}
.tool summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
.tool summary::-webkit-details-marker{display:none}
.tool summary span{font-size:15px;font-weight:500}
.tool summary::after{content:"Info";font-size:12px;color:var(--accent);font-weight:500}
.tool[open] summary::after{content:"Tutup"}
.tool p{margin:6px 0 2px;font-size:14px;color:var(--muted)}

/* Persiapan sampel */
.scale{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0}
.readout{font-size:44px;font-weight:600;letter-spacing:-.02em;background:var(--fill);border-radius:16px;padding:8px 26px;min-width:200px;text-align:center}
.bar{height:8px;border-radius:8px;background:var(--fill);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px}

/* Pengenceran */
.labbox{height:320px}
.lab{position:relative;height:320px;user-select:none;-webkit-user-select:none}
.slots{position:absolute;left:0;right:0;bottom:0;z-index:2;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));pointer-events:none}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:6px 2px;border-radius:14px;transition:background .3s}
.slot.src{background:var(--accent-soft)}
.slot.dst{background:var(--green-soft)}
.slot .nm{font-size:13px;font-weight:600;margin-top:6px;line-height:1.3}
.slot .vl{font-size:12px;color:var(--muted);min-height:16px;line-height:16px}
.role{font-style:normal;font-size:11px;font-weight:600;border-radius:999px;padding:2px 7px;min-height:19px;line-height:15px;color:transparent}
.role.src{background:var(--accent-soft);color:var(--accent)}
.role.dst{background:var(--green-soft);color:var(--green)}
.glass{fill:none;stroke:var(--glass);stroke-width:1.5}
.bottle{position:relative;width:44px;height:100px}
.bottle svg{position:absolute;left:0;top:0}
.bliq{position:absolute;left:5px;right:5px;bottom:4px;height:52px;background:var(--S);border-radius:0 0 6px 6px}
.tube{position:relative;width:26px;height:100px;border:1.5px solid var(--glass);border-top:0;border-radius:0 0 13px 13px}
.tube::before{content:"";position:absolute;left:-5px;right:-5px;top:0;height:2px;border-radius:2px;background:var(--glass)}
.liq{position:absolute;left:0;right:0;bottom:0;height:62%;overflow:hidden;border-radius:0 0 12px 12px;transition:height .6s}
.tube.v10 .liq{height:68%}
.liq i{position:absolute;left:0;right:0;top:0;bottom:0;display:block}
.liq .b{background:var(--bpw)}
.liq .m{background:var(--S);opacity:0;transition:opacity 1.6s}
.liq .t{bottom:auto;height:26%;background:linear-gradient(to bottom,var(--P) 0,var(--P) 65%,transparent 100%);opacity:0;transition:opacity .8s}
.tube.rec .t{opacity:1}
.tube.mixed .m{opacity:1}
.tube.mixed .t{opacity:0}
.binwrap{height:100px;display:flex;align-items:flex-end}
.binbody{fill:var(--bin)}
.binrim{fill:var(--binrim)}
.pip{position:absolute;left:0;top:0;width:26px;height:124px;z-index:1;visibility:hidden;will-change:transform}
.pip.ready{visibility:visible}
.pip svg{display:block;overflow:visible}
.pip .plunger{transition:transform .25s}
.pip.pdown .plunger{transform:translateY(5px)}
.pip.pdown2 .plunger{transform:translateY(9px)}
.pbtn{fill:var(--accent)}
.prod{fill:#8E96A3}
.pbody{fill:#E4E8EE;stroke:#9AA3AE;stroke-width:1}
.pwin{fill:#fff;stroke:#B9C0CA;stroke-width:.8}
.tipEl{position:absolute;left:8px;top:82px;width:10px;height:42px;display:none}
.tipEl svg{display:block}
.tipEl.in{animation:tipin .55s ease-out}
@keyframes tipin{from{transform:translateY(28px);opacity:0}to{transform:none;opacity:1}}
.tipshape{fill:rgba(255,255,255,.6);stroke:#8E96A3;stroke-width:.8}
.tipliq{fill:var(--L,rgba(176,116,64,.8));opacity:0;transition:opacity .6s}
.tipEl.load .tipliq{opacity:1}
.tipEl.fall{z-index:1;transition:transform .8s cubic-bezier(.5,0,1,.6),opacity .3s .5s}
.tipEl.fall.go{transform:translateY(118px) rotate(16deg);opacity:0}
.eq{font-size:14px;color:var(--muted);margin:0 0 6px}
.capbox{min-height:78px;margin:8px 0 10px}
.seq{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.seqbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:12px;background:var(--fill);color:var(--text);
  padding:10px 14px;font-size:15px;font-weight:500;cursor:pointer;line-height:1.3}
.seqbtn .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.seqbtn .tx{flex:1}
.seqbtn.next{background:var(--accent);color:#fff}
.seqbtn.next .num{background:rgba(255,255,255,.25);color:#fff}
.seqbtn.done{background:var(--green-soft);color:var(--green);cursor:default}
.seqbtn.done .num{background:var(--green);color:#fff}
.seqbtn.wait{opacity:.45;cursor:default}
.seqbtn:disabled.next{opacity:.6}
@media (max-width:560px){
  .labbox{height:272px}
  .lab{width:117.65%;transform:scale(.85);transform-origin:0 0}
  .capbox{min-height:100px}
}

/* Pour plate */
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:12px}
.pl{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px;color:var(--text)}
.disc{width:66px;height:66px;border-radius:50%;border:1.5px dashed var(--muted);position:relative;display:block;transition:all .3s}
.pl.inoc .disc::after{content:"";position:absolute;width:16px;height:12px;border-radius:50%;background:rgba(196,140,92,.55);left:24px;top:26px}
.pl.agar .disc{border:2px solid #C9D2D9;background:radial-gradient(circle at 40% 35%,#F4E8C9,#E5D19F)}
.pl.agar .disc::after{display:none}
.pl.flip .disc{box-shadow:inset 0 0 0 5px #DCE3E8}
.pl small{font-size:13px;font-weight:500}
.pl.ctrl small{color:var(--muted)}

/* Inkubasi */
.incubator{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl b{font-size:24px;font-weight:600}
.ring .lbl span{font-size:12px;color:var(--muted)}

/* Hitung koloni */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:var(--fill);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text)}
.tab.on{background:var(--accent);color:#fff}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:6px;vertical-align:1px}
.canvas-wrap{border-radius:16px;background:var(--fill);padding:12px;margin-top:12px;text-align:center}
canvas{touch-action:manipulation;cursor:crosshair;display:inline-block;max-width:100%}
.counter{display:flex;align-items:baseline;gap:8px}
.counter b{font-size:30px;font-weight:600;letter-spacing:-.02em}
.counter span{color:var(--muted);font-size:14px}
.secinfo{font-size:15px}
.stickybar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom));z-index:5;margin-top:12px;
  background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border:.5px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 6px 24px rgba(0,0,0,.14)}
.barrow{display:flex;gap:8px;align-items:center}
.barmsg{margin:0 0 8px;padding:10px 12px;font-size:14px}
.platecard.fs{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;overflow:auto;padding:12px 16px 0;background:var(--bg);box-shadow:none}
.fs .fshead{position:sticky;top:0;z-index:6;background:var(--bg);padding:4px 0 8px}
.fs .canvas-wrap{display:flex;overflow:visible;background:none;padding:12px 0}
.fs canvas{margin:auto;flex:none;max-width:none}
.fs .stickybar{bottom:10px}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:.5px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.g{background:var(--green-soft);color:var(--green)}
.chip.o{background:var(--orange-soft);color:var(--orange)}
.chip.r{background:var(--red-soft);color:var(--red)}
select{font:inherit;font-size:15px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);max-width:100%}
select option{background:var(--card);color:var(--text)}

/* Perhitungan */
.win-row{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:.5px solid var(--line);font-size:14px}
.win-row:last-child{border-bottom:0}
.win-row.dim{opacity:.5}
input[type=range]{width:100%;accent-color:var(--accent)}
.formula{background:var(--fill);border-radius:12px;padding:12px 14px;font-size:15px;margin:10px 0;overflow-x:auto}
.formula div{margin:3px 0;white-space:nowrap}
.ans{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px}
.ans input{font:inherit;width:84px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:center}
.ans input.exp{width:56px}
.pick{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--fill);margin:6px 0;cursor:pointer;border:1.5px solid transparent;width:100%;text-align:left;font-size:15px;color:var(--text)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.pick.on .box{background:var(--accent);border-color:var(--accent);color:#fff}

/* Kuis */
.q{margin-top:18px}
.qt{font-weight:500}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;
  padding:11px 14px;margin:6px 0;font-size:15px;cursor:pointer;color:var(--text)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}

/* Navigasi bawah */

function sniRound(N){
  const n=Math.round(N);if(n<100)return n;
  const s=String(n),k=s.length-2,first=+s.slice(0,2),t=+s[2];
  let r=first;
  if(t>=6)r=first+1;else if(t===5)r=(first%2===0)?first:first+1;
  return r*Math.pow(10,k);
}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function poisson(l,r){
  if(l<=0)return 0;
  if(l<40){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r();}while(p>L);return k-1;}
  const u=Math.max(1e-9,r()),v=r();const z=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  return Math.max(0,Math.round(l+Math.sqrt(l)*z));
}

const QCACHE={};
function qopts(id,qi){
  const k=id+'-'+qi;if(QCACHE[k])return QCACHE[k];
  const q=QUIZ[id][qi];
  const arr=[q.c].concat(q.w).map((t,i)=>({t,ok:i===0}));
  const r=mulberry32(hashStr(k+'#tpc'));
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}
  return QCACHE[k]={o:arr,a:arr.findIndex(x=>x.ok)};
}

/* ---------- Skenario dan koloni ---------- */
function genCounts(c,seed){
  const r=mulberry32(seed);
  const ri=(a,b)=>a+Math.floor(r()*(b-a+1));
  const logU=(a,b)=>Math.pow(10,Math.log10(a)+r()*(Math.log10(b)-Math.log10(a)));
  const n=[0,0,0,0,0,0,0],sp=[false,false,false,false,false,false,false];
  const base=()=>{const N=logU(3.5e5,1.9e6);
    n[0]=Math.max(270,poisson(N/1e3,r));n[1]=Math.max(270,poisson(N/1e3,r));
    n[2]=clamp(poisson(N/1e4,r),27,245);n[3]=clamp(poisson(N/1e4,r),27,245);
    n[4]=clamp(poisson(N/1e5,r),0,22);n[5]=clamp(poisson(N/1e5,r),0,22);};
  if(c==='standar')base();
  else if(c==='dua'){n[0]=poisson(2400,r);n[1]=poisson(2400,r);n[2]=ri(228,247);n[3]=ri(228,247);n[4]=ri(25,30);n[5]=ri(25,30);}
  else if(c==='rendah'){const N=logU(4e3,1.8e4);n[0]=clamp(poisson(N/1e3,r),2,23);n[1]=clamp(poisson(N/1e3,r),2,23);n[2]=poisson(N/1e4,r);n[3]=poisson(N/1e4,r);}
  else if(c==='tinggi'){const N=logU(6e7,2.5e8);for(let i=0;i<6;i++)n[i]=Math.max(400,poisson(N/Math.pow(10,PLATES[i].dil),r));}
  else if(c==='kosong'){/* semua cawan tanpa koloni */}
  else if(c==='spreader'){n[0]=ri(215,248);n[1]=ri(215,248);n[2]=ri(26,36);n[3]=ri(30,55);sp[3]=true;n[4]=ri(2,5);n[5]=ri(0,4);}
  else if(c==='kontrol'){base();n[6]=ri(3,7);}
  else if(c==='selisih'){n[2]=ri(160,205);n[3]=ri(48,78);const m=(n[2]+n[3])/20;n[4]=clamp(poisson(m,r),0,22);n[5]=clamp(poisson(m,r),0,22);n[0]=Math.max(270,poisson((n[2]+n[3])*5,r));n[1]=Math.max(270,poisson((n[2]+n[3])*5,r));}
  else if(c==='duplo7'){n[0]=ri(228,248);n[1]=ri(262,300);n[2]=ri(15,23);n[3]=ri(15,23);n[4]=ri(0,3);n[5]=ri(0,3);}
  else if(c==='duplo8'){n[0]=ri(218,248);n[1]=ri(255,290);n[2]=ri(17,23);n[3]=ri(27,45);n[4]=ri(0,4);n[5]=ri(0,4);}
  else if(c==='duplo9'){
    if(r()<0.5){n[0]=ri(215,248);n[1]=ri(215,248);n[2]=ri(15,23);n[3]=ri(28,48);}
    else{n[0]=ri(215,248);n[1]=ri(255,285);n[2]=ri(27,35);n[3]=ri(26,33);}
    n[4]=ri(0,4);n[5]=ri(0,4);
  }
  return {n,sp};
}
function inPoly(x,y,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function genColonies(i,n,spread,seed){
  const r=mulberry32(seed*31+i*977+7);const C=150,R=137;const out=[];let poly=null;
  if(spread){poly=[];const cx=166,cy=138,b=104;for(let k=0;k<56;k++){const a=k/56*Math.PI*2;const rr=b*(0.86+0.26*(0.5+0.5*Math.sin(k*1.7))*r());poly.push([cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]);}}
  const draw=Math.min(n,4000),dense=n>600,spaced=n<=350;
  const pal=['#F7F0DC','#F1E4C0','#FBF6E8','#EBDBAE'];
  for(let k=0;k<draw;k++){
    const rad=dense?0.7+r()*0.8:(r()<0.7?1.7+r()*1.1:2.9+r()*1.5);
    let x=0,y=0,ok=false,t=0;
    while(!ok&&t<60){t++;const a=r()*Math.PI*2,d=Math.sqrt(r())*(R-rad-1);x=C+Math.cos(a)*d;y=C+Math.sin(a)*d;ok=true;
      if(poly&&inPoly(x,y,poly))ok=false;
      if(ok&&spaced&&t<45){for(const o of out){if(Math.hypot(o.x-x,o.y-y)<o.r+rad+1.4){ok=false;break;}}}}
    if(!ok)continue;
    out.push({x,y,r:rad,c:r()<0.1?'#E3C060':pal[Math.floor(r()*4)]});
  }
  return {col:out,poly};
}
let PL=null,PLkey='';
function plates(){
  const key=S.scen.c+':'+S.scen.seed;if(PL&&PLkey===key)return PL;
  const g=genCounts(S.scen.c,S.scen.seed);
  PL=PLATES.map((p,i)=>{const c=genColonies(i,g.n[i],g.sp[i],S.scen.seed);return Object.assign({},p,{n:g.n[i]>4000?g.n[i]:c.col.length,spread:g.sp[i],col:c.col,poly:c.poly});});
  PLkey=key;return PL;
}
/* Sektor cawan untuk estimasi (SNI 4.1.7.2): 0 kanan atas, 1 kanan bawah, 2 kiri bawah, 3 kiri atas */
function sectorOf(x,y){return x>=150?(y<150?0:1):(y>=150?2:3);}
function sectorInfo(i,q){
  const P=plates()[i];let c=0;
  for(const k of P.col){if(sectorOf(k.x,k.y)===q)c++;}
  const scale=P.col.length?P.n/P.col.length:1;
  const cnt=Math.round(c*scale);
  return {cnt,est:cnt*4};
}

/* ---------- Analisis hasil (SNI 2897:2008 butir 4.1.7 dan 4.1.8) ---------- */
function analysis(){
  const R=S.rec;
  const ctrlV=R[6]&&R[6].type==='count'?R[6].v:0;
  const a={ctrlV,ctrlBad:ctrlV>0,mode:'none',used:[],groups:[],N:0,Nr:0,prefix:'',star:false,duploFlag:false};
  const byD={};
  [0,1,2,3,4,5].forEach(i=>{const r=R[i];if(!r||r.type==='excl')return;(byD[PLATES[i].dil]=byD[PLATES[i].dil]||[]).push(i);});
  const dils=Object.keys(byD).map(Number).sort((x,y)=>x-y);
  const cat=i=>{const r=R[i];return r.type==='est'?'hi':(r.v>250?'hi':(r.v>=25?'in':'lo'));};
  const mean=idx=>idx.reduce((s,i)=>s+R[i].v,0)/idx.length;
  const mk=d=>{const m=mean(byD[d]);return {d,idx:byD[d].slice(),mean:m,N:m*Math.pow(10,d)};};
  const Q=dils.filter(d=>byD[d].some(i=>cat(i)==='in'));
  if(Q.length>=1){
    a.groups=Q.slice(0,2).map(mk);
    a.mode=a.groups.length===2?'two':'one';
    a.N=a.groups.reduce((s,g)=>s+g.N,0)/a.groups.length;
    a.groups.forEach(g=>{if(g.idx.length===2&&g.idx.every(i=>cat(i)==='in')){const v=g.idx.map(i=>R[i].v);if(Math.max(...v)/Math.max(1,Math.min(...v))>=2)a.duploFlag=true;}});
  }else if(dils.length){
    const allZero=dils.every(d=>byD[d].every(i=>R[i].type==='count'&&R[i].v===0));
    if(allZero){const g=mk(dils[0]);a.groups=[g];a.mode='zero';a.N=Math.pow(10,g.d);a.prefix='< ';a.star=true;}
    else{
      const hiD=dils.filter(d=>byD[d].some(i=>cat(i)==='hi'));
      if(hiD.length){const g=mk(hiD[hiD.length-1]);a.groups=[g];a.mode='high';a.N=g.N;a.star=true;}
      else{const g=mk(dils[0]);a.groups=[g];a.mode='low';a.N=g.N;a.star=true;}
    }
  }
  a.used=[].concat(...a.groups.map(g=>g.idx));
  a.Nr=a.mode==='none'?0:sniRound(a.N);
  a.verdict=a.ctrlBad?'invalid':(a.mode==='none'?'invalid':(a.Nr<=1e6?'ok':'notok'));
  a.result=a.mode==='none'?'–':a.prefix+sci(a.Nr)+' CFU/g'+(a.star?'*':'');
  return a;
}
function solutionLines(a){
  const R=S.rec;const L=[];
  const vtxt=i=>R[i].type==='est'?R[i].v+' (estimasi)':String(R[i].v);
  const line=g=>'Pengenceran '+pw(-g.d)+': ('+g.idx.map(vtxt).join(' + ')+') ÷ '+g.idx.length+' = '+dec(+g.mean.toFixed(1))+' koloni; × '+pw(g.d)+' = '+fmt(Math.round(g.N))+' CFU/g';
  const rnd='Pembulatan butir 4.1.8: '+fmt(Math.round(a.N))+' menjadi '+fmt(a.Nr)+' = '+sci(a.Nr)+' CFU/g';
  if(a.mode==='one'||a.mode==='two'){
    a.groups.forEach(g=>L.push(line(g)));
    if(a.mode==='two')L.push('N = ('+a.groups.map(g=>fmt(Math.round(g.N))).join(' + ')+') ÷ 2 = '+fmt(Math.round(a.N))+' CFU/g');
    L.push(rnd);
  }else if(a.mode==='low'){
    L.push('Semua cawan berisi kurang dari 25 koloni (butir 4.1.7.1).');
    L.push(line(a.groups[0]));L.push(rnd);
    L.push('Hasil diberi tanda * (di luar rentang 25 sampai 250 koloni).');
  }else if(a.mode==='high'){
    L.push('Semua cawan berisi lebih dari 250 koloni (butir 4.1.7.2).');
    L.push(line(a.groups[0]));L.push(rnd);
    L.push('Hasil diberi tanda * (di luar rentang 25 sampai 250 koloni).');
  }else if(a.mode==='zero'){
    L.push('Semua cawan tanpa koloni (butir 4.1.7.4).');
    L.push('ALT < 1 × '+pw(a.groups[0].d)+' = < '+sci(a.Nr)+' CFU/g*');
  }
  return L;
}

    {locked:!(p.wOk&&bOk),complete:p.homog===2})+
  quizHTML('sampel');
};

/* ---------- Pengenceran seri ---------- */
const $=id=>document.getElementById(id);
const REDUCED=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const sleep=ms=>new Promise(r=>setTimeout(r,REDUCED?Math.min(ms,80):ms));
let BUSY=false,DEMOING=false,DEMO_STOP=false;
const DIP=70;
const ORDER=['tip','asp','dis','eje','mix'];
const dcol=i=>'rgba(176,116,64,'+[.8,.58,.42,.3,.2][i]+')';
const vname=i=>i===0?'botol '+pw(-1):'tabung '+pw(-(i+1));
const up=s=>s.charAt(0).toUpperCase()+s.slice(1);
const actLabel=(a,s,d)=>({tip:'Pasang tip baru',asp:'Ambil 1 mL dari '+vname(s),dis:'Keluarkan 1 mL ke '+vname(d),eje:'Lepas tip ke wadah limbah',mix:'Homogenkan '+vname(d)+' (ayun dan putar angka 8)'}[a]);
const CAP={
  tip:()=>'Tip baru yang steril terpasang. Setiap transfer memakai tip baru supaya suspensi yang lebih pekat tidak terbawa (carry-over).',
  asp:(s)=>'1 mL suspensi diambil dari '+vname(s)+'. Tekan tombol pipet sampai tahanan pertama, celupkan tip, lalu lepaskan perlahan.',
  dis:(s,d)=>'1 mL dikeluarkan ke '+vname(d)+' yang berisi 9 mL BPW. Totalnya 10 mL, sehingga konsentrasi menjadi sepersepuluh.',
  eje:()=>'Tip bekas dilepas ke wadah limbah. Tip yang sudah dipakai tidak digunakan lagi.',
  mix:(s,d)=>up(vname(d))+' dihomogenkan dengan ayunan dan putaran seperti angka 8, supaya suspensi tersebar merata sebelum diambil lagi.'
};
function tubeState(j){
  const D=S.dil,t=D.t,ph=D.ph;
  const recv=t>j-1||(t===j-1&&ph>=3);
  const mixed=t>=j;
  let v10=recv;
  if(recv&&((t===j&&ph>=2)||t>j))v10=false;
  return {recv,mixed,v10};
}
function sceneHTML(){
  const D=S.dil,t=D.t,ph=D.ph,fin=t>=4;
  const src=fin?-1:t,dst=fin?-1:t+1;
  const cls=i=>'slot'+(src===i?' src':dst===i?' dst':'');
  const role=i=>'<i class="role'+(src===i?' src':dst===i?' dst':'')+'">'+(src===i?'Sumber':dst===i?'Tujuan':'')+'</i>';
  const bvol=(t>0||ph>=2)?249:250;
  let h='<div class="labbox"><div class="lab" id="lab"><div class="slots">';
  h+='<div class="'+cls(0)+'"><div class="bottle" id="tube0" style="--S:'+dcol(0)+'"><svg width="44" height="100" viewBox="0 0 44 100" aria-hidden="true"><path class="glass" d="M16 2h12v12c0 6 12 8 12 20v56a8 8 0 0 1-8 8H12a8 8 0 0 1-8-8V34c0-12 12-14 12-20z"/></svg><div class="bliq"></div></div><b class="nm">'+pw(-1)+'</b><span class="vl">'+bvol+' mL</span>'+role(0)+'</div>';
  for(let j=1;j<=4;j++){
    const st=tubeState(j);
    const c='tube'+(st.recv&&!st.mixed?' rec':'')+(st.mixed?' mixed':'')+(st.v10?' v10':'');
    h+='<div class="'+cls(j)+'"><div class="'+c+'" id="tube'+j+'" style="--P:'+dcol(j-1)+';--S:'+dcol(j)+'"><div class="liq"><i class="b"></i><i class="m"></i><i class="t"></i></div></div><b class="nm">'+pw(-(j+1))+'</b><span class="vl">'+(st.v10?10:9)+' mL</span>'+role(j)+'</div>';
  }
  h+='<div class="slot"><div class="binwrap"><svg width="46" height="66" viewBox="0 0 46 66" aria-hidden="true"><path class="binbody" d="M5 8h36l-4 54a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3z"/><rect class="binrim" x="1" y="3" width="44" height="7" rx="3"/></svg></div><b class="nm">Limbah</b><span class="vl">'+(t+(ph>=4?1:0))+' tip</span><i class="role"></i></div>';
  h+='</div>';
  h+='<div class="pip" id="pip" aria-hidden="true"><svg width="26" height="84" viewBox="0 0 26 84"><g class="plunger"><rect class="pbtn" x="7" y="0" width="12" height="8" rx="3"/><rect class="prod" x="11.5" y="8" width="3" height="8"/></g><path class="pbody" d="M4 18a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v30l-5 12v24H9V60l-5-12z"/><rect class="pwin" x="8" y="24" width="10" height="16" rx="2"/></svg>'+
    '<div class="tipEl'+(ph===2?' load':'')+'" id="tipEl" style="--L:'+dcol(Math.min(t,4))+(ph>=1&&ph<=3?';display:block':'')+'"><svg width="10" height="42" viewBox="0 0 10 42"><polygon class="tipshape" points="0,0 10,0 6.6,42 3.4,42"/><polygon class="tipliq" points="1.3,16 8.7,16 6.6,42 3.4,42"/></svg></div></div></div></div>';
  return h;
}
function capHTML(m){return '<div id="cap" class="note capbox'+(m&&m.k?' '+m.k:'')+'" aria-live="polite">'+(m?(m.h?'<strong>'+m.h+'</strong>':'')+m.t:'')+'</div>';}
function setCapDom(m){const c=$('cap');if(!c)return;c.className='note capbox'+(m&&m.k?' '+m.k:'');c.innerHTML=m?(m.h?'<strong>'+m.h+'</strong>':'')+m.t:'';}
function setPip(col,y,ms){
  const p=$('pip'),lab=$('lab');if(!p||!lab)return;
  const x=(col+0.5)*lab.clientWidth/6-13;
  if(ms){void p.offsetWidth;p.style.transition='transform '+ms+'ms cubic-bezier(.4,0,.2,1)';}else p.style.transition='none';
  p.style.transform='translate('+x.toFixed(1)+'px,'+(y||0)+'px)';
}
function afterDil(){const p=$('pip');if(!p)return;setPip(S.dil.col,0,0);p.classList.add('ready');}

const ANIM={
  async tip(){
    const tp=$('tipEl');tp.style.display='block';tp.classList.remove('in','load');void tp.offsetWidth;tp.classList.add('in');
    await sleep(750);
  },
  async asp(s){
    const pip=$('pip'),tp=$('tipEl');
    if(S.dil.col!==s){setPip(s,0,800);await sleep(850);}
    pip.classList.add('pdown');await sleep(250);
    setPip(s,DIP,550);await sleep(600);
    tp.style.setProperty('--L',dcol(s));tp.classList.add('load');pip.classList.remove('pdown');
    const tb=$('tube'+s);if(tb&&s>0)tb.classList.remove('v10');
    await sleep(800);
    setPip(s,0,550);await sleep(600);
  },
  async dis(s,d){
    const pip=$('pip'),tp=$('tipEl');
    setPip(d,0,800);await sleep(850);
    setPip(d,DIP,550);await sleep(600);
    pip.classList.add('pdown');tp.classList.remove('load');
    const tb=$('tube'+d);if(tb)tb.classList.add('v10','rec');
    await sleep(900);
    setPip(d,0,550);await sleep(600);
    pip.classList.remove('pdown');
  },
  async eje(){
    const pip=$('pip'),tp=$('tipEl'),lab=$('lab');
    setPip(5,0,800);await sleep(850);
    pip.classList.add('pdown2');await sleep(220);
    const c=tp.cloneNode(true);c.removeAttribute('id');c.classList.remove('in','load');c.classList.add('fall');
    c.style.left=((5.5)*lab.clientWidth/6-13+8).toFixed(1)+'px';c.style.top='82px';c.style.display='block';
    lab.appendChild(c);tp.style.display='none';
    void c.offsetWidth;c.classList.add('go');
    await sleep(900);c.remove();
    pip.classList.remove('pdown2');
  },
  async mix(s,d){
    const tb=$('tube'+d);if(!tb)return;
    tb.classList.add('mixed');
    await new Promise(res=>{
      if(REDUCED){res();return;}
      const t0=performance.now(),T=1900;
      const f=now=>{const k=Math.min(1,(now-t0)/T);const th=k*Math.PI*4;
        tb.style.transform='translate('+(9*Math.sin(th)).toFixed(1)+'px,'+(7*Math.sin(2*th)).toFixed(1)+'px) rotate('+(14*Math.sin(th)).toFixed(1)+'deg)';
        if(k<1)requestAnimationFrame(f);else{tb.style.transform='';res();}};
      requestAnimationFrame(f);
    });
    await sleep(250);
  }
};
async function runAction(a){
  BUSY=true;
  const D=S.dil,t=D.t,s=t,d=t+1;
  setCapDom({t:CAP[a](s,d)});
  document.querySelectorAll('.seqbtn,[data-act="demo"]').forEach(b=>{b.disabled=true;});
  try{await ANIM[a](s,d);}catch(e){}
  D.ph++;
  if(a==='asp')D.col=s;else if(a==='dis')D.col=d;else if(a==='eje')D.col=5;
  let m;
  if(D.ph>=5){
    D.t++;D.ph=0;
    if(D.t>=4){S.done[3]=true;m={k:'ok',h:'Pengenceran seri selesai.',t:'Seri '+pw(-1)+' sampai '+pw(-5)+' siap dan semua tabung sudah homogen.'};}
    else m={k:'ok',h:'Transfer '+(t+1)+' selesai.',t:up(vname(d))+' sudah homogen. Lanjutkan ke transfer '+(D.t+1)+' dari 4 dengan tombol nomor 1.'};
  }else m={t:CAP[a](s,d)};
  D.msg=m;BUSY=false;save();render();
}

VIEWS.pengenceran=()=>{
  const D=S.dil,t=D.t,ph=D.ph,fin=t>=4;
  const eq=fin?'Semua transfer selesai: '+pw(-1)+' sampai '+pw(-5)+'.':'1 mL suspensi '+pw(-(t+1))+' + 9 mL BPW = 10 mL, sehingga menjadi '+pw(-(t+2))+' (10 kali lebih encer).';
  const defMsg=fin?{k:'ok',h:'Pengenceran seri selesai.',t:'Seri '+pw(-1)+' sampai '+pw(-5)+' siap dan semua tabung sudah homogen.'}:
    {t:'Pindahkan 1 mL dari '+vname(t)+' ke '+vname(t+1)+'. Tekan tombol yang menyala, satu per satu sesuai nomor.'};
  let body=sceneHTML()+capHTML(D.msg||defMsg);
  if(!fin){
    const lock=BUSY||DEMOING;
    body+='<ol class="seq">'+ORDER.map((a,i)=>{
      const st=i<ph?'done':(i===ph?'next':'wait');
      return '<li><button class="seqbtn '+st+'" data-act="dact" data-a="'+a+'"'+((st!=='next'||lock)?' disabled':'')+'><span class="num">'+(st==='done'?'✓':(i+1))+'</span><span class="tx">'+actLabel(a,t,t+1)+'</span></button></li>';}).join('')+'</ol>'+
      '<div class="row mt">'+(DEMOING?'<button class="linkbtn" id="stopBtn" data-act="stopdemo">Hentikan putar otomatis</button>':'<button class="linkbtn" data-act="demo"'+(BUSY?' disabled':'')+'>Putar otomatis sisa langkah transfer ini</button>')+'</div>';
  }
  return head('Pengenceran seri','Buat pengenceran dari '+pw(-1)+' sampai '+pw(-5)+'. Setiap transfer memindahkan 1 mL suspensi ke tabung berisi 9 mL BPW. Ada 4 transfer, masing-masing terdiri atas 5 tindakan berurutan.')+
  toolsHTML('pengenceran')+
  '<div class="card"><h2>'+(fin?'Pengenceran seri selesai':'Transfer '+(t+1)+' dari 4')+'</h2><p class="eq">'+eq+'</p>'+body+'</div>'+
  quizHTML('pengenceran');
};

VIEWS.pour=()=>{
  const p=S.pour;const allInoc=[0,1,2,3,4,5].every(i=>p.inoc[i]);
  const tmsg={30:{k:'warn',t:'Terlalu dingin. Media mulai memadat sebelum tercampur rata dengan inokulum.'},
    45:{k:'ok',t:'Tepat. Pada sekitar 45 °C, media masih cair dan tidak merusak sel bakteri.'},
    60:{k:'warn',t:'Terlalu panas. Sebagian sel bakteri bisa rusak sehingga hasil hitung lebih rendah.'},
    80:{k:'bad',t:'Terlalu panas. Banyak sel bakteri akan mati.'}};
  const pl=PLATES.map((x,i)=>{let c='pl';if(i===6)c+=' ctrl';if(p.inoc[i])c+=' inoc';if(p.poured)c+=' agar';if(p.inverted)c+=' flip';

  return head('Pour plate','Inokulum 1 mL diletakkan di cawan kosong, lalu PCA cair dituang dan dicampur. Koloni akan tumbuh di permukaan dan di dalam media.')+

  stepCard(1,'Inokulasi','<p class="sub">Pilih tabung, lalu ketuk cawan yang labelnya sesuai. Setiap berganti tabung, tabung dihomogenkan (ayun dan putar angka 8) dan tip baru dipasang.</p>'+
    '<div class="seg">'+[3,4,5].map(v=>'<button class="'+(p.sel===v?'on':'')+'" data-act="tube" data-v="'+v+'">Tabung '+pw(-v)+'</button>').join('')+'</div>'+
    '<div class="plates mt">'+pl+'</div>'+note(p.msg)+
    note({t:'Cawan kontrol diisi PCA tanpa inokulum. Cawan ini memeriksa sterilitas media dan lingkungan kerja.'}),{complete:allInoc})+
  stepCard(2,'Siapkan PCA','<p class="sub">PCA cair diambil dari waterbath. Pada suhu berapa PCA siap dituang?</p>'+
    '<div class="seg">'+[30,45,60,80].map(v=>'<button class="'+(p.temp===v?'on':'')+'" data-act="pcatemp" data-v="'+v+'">'+v+' °C</button>').join('')+'</div>'+note(p.temp?tmsg[p.temp]:null),
    {locked:!allInoc,complete:p.temp===45})+

    '<div class="row mt"><button class="btn" id="pourBtn" data-act="pour"'+((p.poured||p.vol===0)?' disabled':'')+'>Tuang PCA ke 7 cawan</button></div>'+note(p.vmsg),
    {locked:p.temp!==45,complete:p.poured})+
  stepCard(4,'Homogenkan, padatkan, balik','<p class="sub">'+ph4+'</p><div class="row">'+
    '<button class="btn '+(p.mixed?'gray':'')+'" data-act="mix"'+(p.mixed?' disabled':'')+'>Homogenkan</button>'+
    '<button class="btn '+(p.solid?'gray':'')+'" data-act="solid"'+(!p.mixed||p.solid?' disabled':'')+'>Biarkan memadat</button>'+
    '<button class="btn '+(p.inverted?'gray':'')+'" data-act="invert"'+(!p.solid||p.inverted?' disabled':'')+'>Balik cawan</button></div>',
    {locked:!p.poured,complete:p.inverted})+

VIEWS.hitung=()=>{
  const P=plates();const i=S.cur;const pl=P[i];const m=(S.marks[i]||[]).length;const rec=S.rec[i];

  const recTxt=r=>!r?'<span class="muted">Belum dicatat</span>':r.type==='count'?r.v+' koloni':r.type==='est'?'Estimasi '+fmt(r.v)+' koloni (> 250)':'Tidak dihitung (spreader)';

    '<span class="counter"><b id="cnt">'+m+'</b><span>koloni ditandai</span></span>';

  const bar='<div class="stickybar">'+(S.hmsg?'<div class="note barmsg '+(S.hmsg.k||'')+'">'+(S.hmsg.h?'<strong>'+S.hmsg.h+'</strong>':'')+S.hmsg.t+'</div>':'')+

    '<li>Koloni yang jelas lebih dari 250 tidak dihitung satu per satu. SNI 2897:2008 butir 4.1.7.2 meminta estimasi yang representatif: bagi cawan menjadi empat sektor (tombol Sektor), pilih satu sektor, lalu kalikan jumlahnya dengan 4. Di literatur lain, kondisi ini disebut TNTC (Too Numerous To Count, terlalu banyak untuk dihitung).</li>'+

  det('hg-tools','acc','Alat dan bahan di langkah ini',toolsInner('hitung'))+

VIEWS.perhitungan=()=>{

    '<p><b>Di atas 250 koloni</b>, koloni berdempetan dan bergabung sehingga sulit dibedakan. Persaingan ruang dan nutrisi juga menghambat pertumbuhan. Akibatnya, hasil hitung cenderung lebih rendah dari jumlah sebenarnya.</p>'+

     c.selOk===false?note({k:'warn',h:'Belum tepat.',t:'Periksa aturan pemilihan cawan. Perhatikan apakah cawan duplo di luar rentang ikut dihitung, dan cawan spreader tidak dihitung.'}):'')+
    (a.duploFlag&&c.selOk===true?note({k:'warn',h:'Selisih antar-duplo cukup besar.',t:'Kemungkinan penyebabnya: suspensi kurang homogen, volume pipet tidak tepat, atau kontaminasi. Hasil tetap dihitung, tetapi beri catatan pada laporan dan diskusikan dengan dosen atau asisten apakah pengujian perlu diulang.'}):''),
    {locked:!showSel,complete:c.selOk===true}))+
  (a.ctrlBad&&ctrlOk?'':

    (a.mode==='low'||a.mode==='high'||a.mode==='zero'?'<p class="small">Pada kasus ini hasil diberi tanda *'+(a.mode==='zero'?' dan dilaporkan sebagai kurang dari 1 × faktor pengenceran terendah. Tulis angkanya tanpa tanda &lt;.':'. Tulis angkanya tanpa tanda *.')+'</p>':'')+
    '<div class="ans mt"><span>Hasil Anda:</span><input inputmode="decimal" data-in="m" value="'+c.m+'" placeholder="1,3" aria-label="Angka depan"><span>× 10</span><input class="exp" inputmode="numeric" data-in="e" value="'+c.e+'" placeholder="6" aria-label="Pangkat"><span>CFU/g</span></div>'+
    '<div class="row mt"><button class="btn tint" data-act="checkans">Periksa hasil</button><button class="linkbtn" data-act="sol">'+(c.sol?'Sembunyikan':'Lihat')+' pembahasan</button></div>'+

/* ---------- Render ---------- */
const nav=document.getElementById('nav'),app=document.getElementById('app'),foot=document.getElementById('foot');
const canEnter=i=>{for(let j=0;j<i;j++)if(!S.done[j])return false;return true;};
let lastStep=-1;
function updFade(pc){const w=document.getElementById('swrap');if(!w||!pc)return;w.classList.toggle('fl',pc.scrollLeft>4);w.classList.toggle('fr',pc.scrollLeft<pc.scrollWidth-pc.clientWidth-4);}
function setupStrip(pc){
  let down=false,sx=0,sl=0,moved=false;
  pc.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;sx=e.clientX;sl=pc.scrollLeft;});
  pc.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-sx;
    if(!moved&&Math.abs(dx)>4){moved=true;pc.classList.add('drag');try{pc.setPointerCapture(e.pointerId);}catch(_){}}
    if(moved)pc.scrollLeft=sl-dx;});
  const end=()=>{if(!down)return;down=false;pc.classList.remove('drag');};
  pc.addEventListener('pointerup',end);pc.addEventListener('pointercancel',end);
  pc.addEventListener('click',e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false;}},true);
  pc.addEventListener('wheel',e=>{
    if(pc.scrollWidth<=pc.clientWidth)return;
    if(Math.abs(e.deltaY)<=Math.abs(e.deltaX))return;
    const max=pc.scrollWidth-pc.clientWidth;
    if((e.deltaY<0&&pc.scrollLeft<=0)||(e.deltaY>0&&pc.scrollLeft>=max-1))return;
    pc.scrollLeft+=e.deltaY;e.preventDefault();
  },{passive:false});
  pc.addEventListener('scroll',()=>updFade(pc),{passive:true});
}
function render(){
  const doneCount=STEPS.filter((s,i)=>S.done[i]).length;
  const old=document.getElementById('pills');const keep=old?old.scrollLeft:0;
  nav.innerHTML='<div class="nav-inner"><div class="nav-top"><div class="brand">Simulasi TPC daging<small>'+STEPS[S.step].t+'</small></div><button class="linkbtn" data-act="reset">Mulai ulang</button></div>'+
    '<div class="progress"><i style="width:'+(doneCount/STEPS.length*100)+'%"></i></div>'+
    '<div class="steps-wrap" id="swrap"><div class="steps" id="pills">'+STEPS.map((s,i)=>'<button class="pill'+(i===S.step?' active':'')+(S.done[i]?' done':'')+'" data-act="go" data-i="'+i+'"'+(canEnter(i)?'':' disabled')+(i===S.step?' aria-current="step"':'')+'>'+(i+1)+'. '+s.t+'</button>').join('')+'</div></div></div>';
  app.innerHTML=VIEWS[STEPS[S.step].id]();
  const last=S.step===STEPS.length-1;
  foot.innerHTML='<div class="foot-inner"><button class="btn gray" data-act="prev"'+(S.step===0?' disabled':'')+'>Kembali</button>'+
    '<span class="foot-hint">'+(S.done[S.step]||last?'':'Selesaikan kegiatan di langkah ini untuk melanjutkan.')+'</span>'+
    (last?'<span></span>':'<button class="btn" data-act="next"'+(S.done[S.step]?'':' disabled')+'>Lanjut</button>')+'</div>';
  const pc=document.getElementById('pills');
  pc.scrollLeft=keep;
  const act=pc.querySelector('.pill.active');
  if(act&&S.step!==lastStep){
    const target=Math.max(0,act.offsetLeft-pc.clientWidth/2+act.clientWidth/2);
    if(lastStep===-1||REDUCED)pc.scrollLeft=target;else pc.scrollTo({left:target,behavior:'smooth'});
  }
  lastStep=S.step;
  setupStrip(pc);updFade(pc);
  document.body.classList.toggle('nosc',!!(S.zoom&&STEPS[S.step].id==='hitung'));
  if(STEPS[S.step].id==='hitung')drawCanvas();
  if(STEPS[S.step].id==='perhitungan')updWin();
  if(STEPS[S.step].id==='pengenceran')afterDil();
}
function go(i){
  if(i<0||i>=STEPS.length)return;
  if(i>S.step&&!canEnter(i))return;
  S.step=i;S.zoom=false;if(STEPS[i].id==='ringkasan')S.done[i]=true;
  save();render();window.scrollTo(0,0);
}

/* ---------- Canvas cawan ---------- */
function drawCanvas(){
  const cv=document.getElementById('plate');if(!cv)return;
  const wrap=cv.parentElement;
  let size;
  if(S.zoom)size=Math.round(Math.min(1100,Math.max(620,Math.min(window.innerWidth,window.innerHeight)*1.8)));
  else size=Math.round(Math.max(220,Math.min(440,wrap.clientWidth-24,window.innerHeight-380)));
  const dpr=window.devicePixelRatio||1;
  cv.style.width=size+'px';cv.style.height=size+'px';cv.width=Math.round(size*dpr);cv.height=Math.round(size*dpr);
  const ctx=cv.getContext('2d');if(!ctx)return;
  const s=size*dpr/300;ctx.setTransform(s,0,0,s,0,0);ctx.clearRect(0,0,300,300);
  const P=plates()[S.cur];
  ctx.beginPath();ctx.arc(150,150,148,0,Math.PI*2);ctx.fillStyle='#E3E9EE';ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='#B8C2CB';ctx.stroke();
  ctx.beginPath();ctx.arc(150,150,141,0,Math.PI*2);
  const g=ctx.createRadialGradient(125,115,10,150,150,141);g.addColorStop(0,'#F4E8C9');g.addColorStop(1,'#E3CE9B');ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(150,130,90,.35)';ctx.lineWidth=.8;ctx.stroke();
  if(P.n>600){ctx.beginPath();ctx.arc(150,150,140,0,Math.PI*2);ctx.fillStyle='rgba(250,244,226,.35)';ctx.fill();}
  if(P.poly){
    ctx.save();ctx.beginPath();ctx.arc(150,150,140,0,Math.PI*2);ctx.clip();
    ctx.beginPath();P.poly.forEach((q,k)=>k?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();
    ctx.fillStyle='rgba(250,246,234,.82)';ctx.fill();ctx.strokeStyle='rgba(196,178,135,.9)';ctx.lineWidth=1.2;ctx.stroke();
    ctx.strokeStyle='rgba(205,190,150,.45)';ctx.lineWidth=.8;
    for(let k=1;k<4;k++){ctx.beginPath();P.poly.forEach((q,j)=>{const x=166+(q[0]-166)*(1-k*0.22),y=138+(q[1]-138)*(1-k*0.22);j?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.closePath();ctx.stroke();}
    ctx.restore();
  }
  const dense=P.n>600;
  for(const c of P.col){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fillStyle=c.c;ctx.fill();
    if(!dense){ctx.lineWidth=.5;ctx.strokeStyle='rgba(150,125,80,.55)';ctx.stroke();}}
  if(S.sec.on){
    ctx.save();ctx.beginPath();ctx.arc(150,150,141,0,Math.PI*2);ctx.clip();
    const q=S.sec.q[S.cur];
    if(q!==undefined){ctx.fillStyle='rgba(0,113,227,.18)';ctx.fillRect((q===0||q===1)?150:0,(q===0||q===3)?0:150,150,150);}
    ctx.strokeStyle='rgba(0,113,227,.9)';ctx.lineWidth=1.3;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.moveTo(150,5);ctx.lineTo(150,295);ctx.moveTo(5,150);ctx.lineTo(295,150);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
  const mk=new Set(S.marks[S.cur]||[]);
  if(S.reveal[S.cur]&&!dense){ctx.strokeStyle='#E5302A';ctx.lineWidth=.9;P.col.forEach((c,k)=>{if(!mk.has(k)){ctx.beginPath();ctx.arc(c.x,c.y,c.r+2.2,0,Math.PI*2);ctx.stroke();}});}
  ctx.fillStyle='#1D4ED8';mk.forEach(k=>{const c=P.col[k];if(c){ctx.beginPath();ctx.arc(c.x,c.y,Math.max(1.3,c.r*0.55),0,Math.PI*2);ctx.fill();}});
  cv.onclick=onPlateClick;
}
function onPlateClick(e){
  const cv=e.currentTarget;const rect=cv.getBoundingClientRect();
  const x=(e.clientX-rect.left)/rect.width*300,y=(e.clientY-rect.top)/rect.height*300;
  if(S.sec.on){
    if(Math.hypot(x-150,y-150)>141)return;
    S.sec.q[S.cur]=sectorOf(x,y);S.hmsg=null;save();render();return;
  }
  const P=plates()[S.cur];const m=S.marks[S.cur]||(S.marks[S.cur]=[]);const set=new Set(m);
  const tol=S.zoom?3:5;let best=-1,bd=1e9;
  P.col.forEach((c,k)=>{if(set.has(k))return;const d=Math.hypot(c.x-x,c.y-y);if(d<c.r+tol&&d<bd){bd=d;best=k;}});
  if(best<0)return;
  m.push(best);save();drawCanvas();updCount();
}
function updCount(){const n=(S.marks[S.cur]||[]).length;const c=document.getElementById('cnt');if(c)c.textContent=n;const b=document.getElementById('recBtn');if(b&&!S.sec.on)b.textContent='Catat '+n+' koloni';}

function updWin(){
  const out=document.getElementById('winOut'),lbl=document.getElementById('winN');if(!out)return;
  const N=Math.pow(10,S.calc.win);lbl.textContent=sci(N)+' CFU/g';
  let rows='',ok=[];
  for(let k=1;k<=5;k++){const v=N*Math.pow(10,-k);const plated=k>=3;
    const st=v>250?'<span class="chip o">> 250</span>':v<25?'<span class="chip">< 25</span>':'<span class="chip g">25–250</span>';
    if(plated&&v>=25&&v<=250)ok.push(pw(-k));
    rows+='<div class="win-row'+(plated?'':' dim')+'"><b>'+pw(-k)+'</b><span>± '+(v>=1e5?sci(v):fmt(Math.round(v)))+' koloni'+(plated?'':' (tidak dituang)')+'</span>'+st+'</div>';}
  out.innerHTML=rows+'<p class="small mt" style="margin-bottom:0">'+(ok.length?'Cawan yang dapat dihitung: '+ok.join(' dan ')+'.':'Tidak ada cawan yang dituang berada dalam rentang 25 sampai 250.')+
    ' '+(N>1e6?'Perkiraan ini melebihi batas 1 × 10'+sup(6)+' CFU/g.':'Perkiraan ini tidak melebihi batas 1 × 10'+sup(6)+' CFU/g.')+'</p>';
}

/* ---------- Aksi ---------- */
function resetCount(){S.marks={};S.rec={};S.reveal={};S.hmsg=null;S.cur=0;S.sec={on:false,q:{}};S.calc=Object.assign(fresh().calc,{win:S.calc.win});S.done[6]=false;S.done[7]=false;S.done[8]=false;}
function setScenario(sel){S.scen.sel=sel;S.scen.c=sel==='acak'?CASE_KEYS[Math.floor(Math.random()*CASE_KEYS.length)]:sel;S.scen.seed=newSeed();resetCount();}
function animate(ms,onStep,onEnd){const t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/ms);onStep(k);if(k<1)requestAnimationFrame(f);else onEnd();};requestAnimationFrame(f);}
function afterRec(){S.done[6]=PLATES.every((x,j)=>S.rec[j]);S.done[7]=false;S.calc=Object.assign(fresh().calc,{win:S.calc.win});render();}

const A={
  go:d=>go(+d.i), next:()=>go(S.step+1), prev:()=>go(S.step-1),
  reset:()=>{if(confirm('Mulai ulang simulasi? Semua progres akan dihapus.')){S=fresh();PL=null;lastStep=-1;save();render();window.scrollTo(0,0);}},
  ns:d=>{S.nsamp=clamp(S.nsamp+(+d.v),1,10);render();},
  check:d=>{S.checks[d.id]=!S.checks[d.id];S.done[1]=ITEMS.every(x=>S.checks[x.id]);render();},
  checkall:()=>{ITEMS.forEach(x=>S.checks[x.id]=true);S.done[1]=true;render();},
  w:d=>{const p=S.prep;p.w=Math.max(0,Math.min(60,Math.round((p.w+(+d.v))*10)/10));if(p.wOk){p.wOk=false;p.bpw=null;p.homog=0;S.done[2]=false;}p.wmsg=null;render();},
  tare:()=>{const p=S.prep;p.w=0;p.wOk=false;p.bpw=null;p.homog=0;p.wmsg=null;S.done[2]=false;render();},
  wconfirm:()=>{const p=S.prep;if(Math.abs(p.w-25)<0.05){p.wOk=true;p.wmsg={k:'ok',t:'Berat sampel 25,0 g.'};}
    else{p.wOk=false;p.wmsg={k:'warn',t:'Berat belum tepat. Target 25,0 g, saat ini '+dec(p.w.toFixed(1))+' g.'};}render();},
  bpw:d=>{S.prep.bpw=+d.v;if(S.prep.bpw!==225){S.prep.homog=0;S.done[2]=false;}render();},
  homog:()=>{const p=S.prep;if(p.homog)return;p.homog=1;render();
    animate(2200,k=>{const b=document.getElementById('mixBar');if(b)b.style.width=(k*100)+'%';},()=>{p.homog=2;S.done[2]=true;save();render();});},
  dact:d=>{const D=S.dil;if(D.t>3||BUSY||DEMOING)return;if(ORDER[D.ph]!==d.a)return;runAction(d.a);},
  demo:async()=>{
    if(BUSY||DEMOING||S.dil.t>3)return;
    DEMOING=true;DEMO_STOP=false;const t0=S.dil.t;render();
    while(S.dil.t===t0&&!DEMO_STOP){
      await runAction(ORDER[S.dil.ph]);
      if(S.dil.t===t0&&!DEMO_STOP)await sleep(700);
    }
    DEMOING=false;DEMO_STOP=false;save();render();
  },
  stopdemo:()=>{DEMO_STOP=true;const b=$('stopBtn');if(b)b.textContent='Berhenti setelah tindakan ini…';},
  tube:d=>{const p=S.pour;if(p.poured)return;p.sel=+d.v;p.msg={t:'Tabung '+pw(-p.sel)+' dihomogenkan (ayun dan putar angka 8) dan tip baru dipasang. Ketuk cawan '+pw(-p.sel)+' A dan '+pw(-p.sel)+' B.'};render();},
  plate:d=>{const p=S.pour;const i=+d.i;if(p.poured)return;
    if(i===6){p.msg={k:'warn',t:'Cawan kontrol tidak diberi inokulum.'};}
    else if(p.sel===null){p.msg={k:'warn',t:'Pilih tabung terlebih dahulu.'};}
    else if(PLATES[i].dil!==p.sel){p.msg={k:'warn',t:'Label cawan ini '+pw(-PLATES[i].dil)+'. Inokulum dari tabung '+pw(-p.sel)+' masuk ke cawan '+pw(-p.sel)+'.'};}
    else if(p.inoc[i]){p.msg={t:'Cawan ini sudah berisi 1 mL inokulum.'};}
    else{p.inoc[i]=true;const all=[0,1,2,3,4,5].every(j=>p.inoc[j]);p.msg={k:all?'ok':'',t:all?'Enam cawan sudah berisi inokulum. Cawan kontrol tetap kosong.':'1 mL suspensi '+pw(-p.sel)+' dimasukkan ke cawan '+plateLabel(i)+'.'};}
    render();},
  pcatemp:d=>{const p=S.pour;if(p.poured)return;p.temp=+d.v;render();},
  pour:()=>{const p=S.pour;
    if(p.vol<15)p.vmsg={k:'warn',t:'Volume terlalu sedikit. Media terlalu tipis, mudah kering, dan inokulum tidak tercampur rata. Gunakan 15 sampai 20 mL.'};
    else if(p.vol>20)p.vmsg={k:'warn',t:'Volume terlalu banyak. Media terlalu tebal sehingga koloni di dalamnya sulit terlihat dan bahan terbuang. Gunakan 15 sampai 20 mL.'};
    else{p.poured=true;p.vmsg={k:'ok',t:'PCA '+p.vol+' mL dituang ke setiap cawan, termasuk cawan kontrol.'};}
    render();},
  mix:()=>{S.pour.mixed=true;render();},
  solid:()=>{S.pour.solid=true;render();},
  invert:()=>{S.pour.inverted=true;S.done[4]=true;render();},
  itemp:d=>{if(S.inc.done)return;S.inc.temp=clamp(S.inc.temp+(+d.v),25,45);S.inc.msg=null;render();},
  hours:d=>{if(S.inc.done)return;S.inc.hours=+d.v;S.inc.msg=null;render();},
  incubate:()=>{const c=S.inc;if(c.done)return;
    if(c.hours===null){c.msg={k:'warn',t:'Pilih lama inkubasi terlebih dahulu.'};render();return;}
    if(c.temp<34||c.temp>36){
      c.msg={k:'warn',h:'Suhu belum sesuai metode.',t:'SNI 2897:2008 butir e) menetapkan 34 sampai 36 °C.'+(c.temp===30?' Kondisi 30 °C tercantum di SNI 7388:2009, sedangkan simulasi ini mengikuti metode SNI 2897:2008. Atur suhu ke 34 sampai 36 °C.':' Suhu di luar rentang ini mengubah pertumbuhan bakteri sehingga hasil tidak sebanding dengan standar.')};
      render();return;}
    if(c.hours===12){c.msg={k:'warn',t:'Terlalu singkat. SNI 2897:2008 menetapkan 24 sampai 48 jam. Pada 12 jam banyak koloni belum cukup besar untuk terlihat.'};render();return;}
    if(c.hours===72){c.msg={k:'warn',h:'Lama inkubasi belum sesuai metode.',t:'Inkubasi 72 jam tercantum di SNI 7388:2009, sedangkan simulasi ini mengikuti metode SNI 2897:2008 (24 sampai 48 jam). Pilih 24 atau 48 jam.'};render();return;}
    const btn=document.getElementById('incBtn');if(btn){btn.disabled=true;btn.textContent='Inkubasi berjalan…';}
    const C=2*Math.PI*56;
    animate(2400,k=>{const a=document.getElementById('ringArc'),t=document.getElementById('ringTxt');if(a)a.setAttribute('stroke-dashoffset',(C*(1-k)).toFixed(1));if(t)t.textContent=Math.round(k*c.hours)+' jam';},
      ()=>{c.done=true;S.done[5]=true;c.msg={k:'ok',t:'Inkubasi '+c.hours+' jam pada '+c.temp+' °C selesai. Koloni sudah tumbuh dan siap dihitung.'+(c.hours===24?' Bila koloni masih sangat kecil pada 24 jam, SNI 2897:2008 mengizinkan inkubasi sampai 48 jam.':'')};save();render();});},
  pt:d=>{S.cur=+d.i;S.hmsg=null;render();},
  pprev:()=>{S.cur=Math.max(0,S.cur-1);S.hmsg=null;render();},
  pnext:()=>{S.cur=Math.min(PLATES.length-1,S.cur+1);S.hmsg=null;render();},
  undo:()=>{
    if(S.sec.on){delete S.sec.q[S.cur];S.hmsg=null;render();return;}
    const m=S.marks[S.cur];if(m&&m.length){m.pop();save();drawCanvas();updCount();}},
  clearm:()=>{S.marks[S.cur]=[];save();drawCanvas();updCount();},
  sector:()=>{S.sec.on=!S.sec.on;S.hmsg=null;render();},
  zoom:()=>{S.zoom=!S.zoom;render();},
  reveal:()=>{S.reveal[S.cur]=!S.reveal[S.cur];render();},
  rec:d=>{const i=S.cur;const P=plates()[i];const big=P.n>250&&!P.spread;const t=d.v;
    if(t==='count'){
      if(P.spread){S.hmsg={k:'warn',t:'Area spreader menutupi lebih dari '+Math.round(SPREAD_LIMIT*100)+'% cawan. Cawan seperti ini tidak dihitung.'};}
      else if(big){S.hmsg={k:'warn',t:'Koloni pada cawan ini lebih dari 250 dan terlalu padat untuk dihitung satu per satu. Gunakan estimasi per sektor (tombol Sektor).'};}
      else{const v=(S.marks[i]||[]).length;S.rec[i]={type:'count',v};const diff=Math.abs(v-P.n);
        S.hmsg=diff===0?{k:'ok',t:'Tercatat '+v+' koloni. Hitungan Anda tepat.'}:
          diff<=Math.max(2,P.n*0.05)?{k:'ok',t:'Tercatat '+v+' koloni. Selisihnya kecil dari jumlah sebenarnya.'}:
          {k:'warn',t:'Tercatat '+v+' koloni. Selisihnya cukup jauh dari jumlah sebenarnya. Periksa koloni yang belum ditandai, lalu catat ulang.'};}
    }else if(t==='est'){
      const q=S.sec.q[i];const info=q!==undefined?sectorInfo(i,q):null;
      if(!info){S.hmsg={k:'warn',t:'Ketuk satu sektor pada cawan terlebih dahulu.'};}
      else if(P.spread){S.hmsg={k:'warn',t:'Cawan ini tertutup spreader. Gunakan tombol "Tidak dihitung (spreader)".'};}
      else if(!big){S.hmsg={k:'warn',t:'Koloni pada cawan ini masih bisa dihitung satu per satu. Matikan mode Sektor, tandai setiap koloni, lalu catat jumlahnya.'};}
      else{S.rec[i]={type:'est',v:info.est,q};S.hmsg={k:'ok',t:'Tercatat estimasi '+fmt(info.est)+' koloni (sektor '+QNAME[q]+' × 4).'};}
    }else{
      if(!P.spread){S.hmsg={k:'warn',t:'Tidak ada spreader besar pada cawan ini.'};}
      else{S.rec[i]={type:'excl'};S.hmsg={k:'ok',t:'Cawan tidak dihitung karena spreader menutupi lebih dari '+Math.round(SPREAD_LIMIT*100)+'% permukaan media.'};}
    }
    afterRec();},
  autofill:()=>{const i=S.cur;const P=plates()[i];
    if(P.spread)S.rec[i]={type:'excl'};
    else if(P.n>250){const info=sectorInfo(i,0);S.sec.q[i]=0;S.rec[i]={type:'est',v:info.est,q:0};}
    else{S.marks[i]=P.col.map((c,k)=>k);S.rec[i]={type:'count',v:P.n};}
    S.hmsg={t:'Cawan diisi otomatis. Di laboratorium, setiap koloni tetap dihitung manual.'};
    afterRec();},
  reseed:()=>{setScenario(S.scen.sel);render();},
  ctrl:d=>{S.calc.ctrl=d.v;render();},
  selp:d=>{const c=S.calc;c.sel[d.i]=!c.sel[d.i];c.selOk=null;render();},
  checksel:()=>{const a=analysis();const c=S.calc;const picked=[0,1,2,3,4,5].filter(i=>c.sel[i]);
    c.selOk=picked.length===a.used.length&&picked.every(i=>a.used.includes(i));render();},
  checkans:()=>{const a=analysis();const c=S.calc;const m=parseFloat(String(c.m).replace(',','.'));const e=parseInt(c.e,10);
    if(isNaN(m)||isNaN(e)){c.ansOk=false;render();return;}
    const v=m*Math.pow(10,e);c.ansOk=Math.abs(v-a.Nr)/a.Nr<=0.03||Math.abs(v-a.N)/a.N<=0.03;render();},
  sol:()=>{S.calc.sol=!S.calc.sol;render();},
  interp:d=>{const a=analysis();S.calc.interp=d.v;S.done[7]=d.v===a.verdict;render();},
  quiz:d=>{S.quiz[d.k]=+d.v;render();},
  qreset:d=>{delete S.quiz[d.k];render();},
  print:()=>window.print(),
  again:()=>{setScenario(S.scen.sel);go(6);}
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.disabled)return;
  if((BUSY||DEMOING)&&t.dataset.act!=='stopdemo')return;
  const f=A[t.dataset.act];if(f){f(t.dataset);save();}
});
document.addEventListener('input',e=>{
  const t=e.target;const k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='vol'){S.pour.vol=+t.value;S.pour.vmsg=null;const l=document.getElementById('volLbl');if(l)l.textContent=t.value+' mL';const b=document.getElementById('pourBtn');if(b)b.disabled=S.pour.poured||S.pour.vol===0;}
  else if(k==='win'){S.calc.win=+t.value;updWin();}
  else if(k==='m'){S.calc.m=t.value;S.calc.ansOk=null;}
  else if(k==='e'){S.calc.e=t.value;S.calc.ansOk=null;}
  save();
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.in==='scen'){setScenario(t.value);save();render();}
});
document.addEventListener('toggle',e=>{
  const d=e.target;if(d&&d.dataset&&d.dataset.key){S.open[d.dataset.key]=d.open;save();}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.zoom){S.zoom=false;render();}});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{const id=STEPS[S.step].id;if(id==='hitung')drawCanvas();else if(id==='pengenceran'&&!BUSY)setPip(S.dil.col,0,0);updFade(document.getElementById('pills'));},150);});

load();render();
})();
</script>
