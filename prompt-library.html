<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fbfbfd;
            --sidebar-bg: #ffffff;
            --accent-color: #0071e3;
            --secondary-accent: #5e5ce6;
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --border-color: #d2d2d7;
            --success-color: #34c759;
            --code-bg: #f5f5f7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header { padding: 28px 24px 16px; }
        .sidebar-header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 16px; }

        .search-container { position: relative; margin-bottom: 12px; }
        .search-container input {
            width: 100%;
            padding: 11px 12px 11px 40px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: #f2f2f7;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .search-container input:focus { background: #fff; border-color: var(--accent-color); box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }
        .search-container .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }

        mark {
            background: rgba(0, 113, 227, 0.15);
            color: var(--accent-color);
            border-radius: 3px;
            padding: 0 2px;
            font-weight: 600;
        }

        .search-result-info {
            padding: 0 24px 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
            display: none;
        }
        .search-result-info.visible { display: block; }

        .prompt-list { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
        .category-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; padding: 20px 12px 8px; }
        .prompt-item {
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 3px;
            font-size: 0.9rem;
        }
        .prompt-item:hover { background-color: #f5f5f7; }
        .prompt-item.active { background-color: var(--accent-color); color: white; font-weight: 500; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25); }

        /* --- MAIN CONTENT --- */
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: white; position: relative; }

        .content-header {
            position: sticky; top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            padding: 20px 48px;
            border-bottom: 1px solid rgba(210, 210, 215, 0.5);
            z-index: 50;
            display: flex; align-items: center; gap: 16px;
        }

        #menuToggle { display: none; background: #f2f2f7; border: none; cursor: pointer; padding: 10px; border-radius: 10px; color: var(--text-main); flex-shrink: 0; box-shadow: none !important; transform: none !important; }

        .header-info { flex: 1; min-width: 0; }
        .header-info h2 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .content-body { padding: 40px 48px; max-width: 1000px; width: 100%; margin: 0 auto; }

        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.2); z-index: 90; backdrop-filter: blur(4px); }

        /* --- GUIDE BOX --- */
        .guide-box {
            background-color: #fff;
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 28px;
            border: 1px solid var(--border-color);
        }
        .guide-box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .guide-box h3 { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; }
        .guide-box p { font-size: 1rem; line-height: 1.65; color: #3a3a3c; white-space: pre-line; }

        /* --- LANGUAGE TOGGLE (di dalam guide box) --- */
        .lang-toggle {
            display: none; /* ditampilkan via JS bila ada terjemahan */
            align-items: center;
            gap: 0;
            background: #f2f2f7;
            border-radius: 10px;
            padding: 3px;
            flex-shrink: 0;
        }
        .lang-btn {
            padding: 6px 13px;
            border-radius: 8px;
            border: none;
            background: transparent;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.03em;
            box-shadow: none !important;
            transform: none !important;
        }
        .lang-btn.active {
            background: white;
            color: var(--accent-color);
            box-shadow: 0 1px 4px rgba(0,0,0,0.1) !important;
        }
        .lang-btn:hover:not(.active) { color: var(--text-main); }

        /* --- PROMPT CONTAINER --- */
        .prompt-container {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .prompt-actions-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 10px; padding: 12px 18px;
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
        }

        .no-translation-notice {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 0.78rem;
            color: var(--text-muted);
            padding: 6px 12px;
            background: #fff8e6;
            border-radius: 8px;
            border: 1px solid #ffe4a0;
            margin-right: auto;
        }
        .no-translation-notice.visible { display: flex; }

        .prompt-text { 
            padding: 28px 32px; 
            white-space: pre-wrap; 
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem; 
            line-height: 1.85; 
            color: #24292e; 
            background: #fff;
            letter-spacing: -0.01em;
        }

        .prompt-text mark {
            background: rgba(255, 214, 0, 0.4);
            color: inherit;
            border-radius: 3px;
            padding: 0 2px;
            font-weight: inherit;
        }

        /* --- BUTTONS --- */
        button, .btn-link {
            display: flex; align-items: center; gap: 7px;
            padding: 9px 16px; border-radius: 11px; border: none;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease; font-size: 0.82rem;
            text-decoration: none; font-family: 'Inter', sans-serif;
        }

        .btn-copy { background-color: var(--accent-color); color: white; }
        .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3); }

        .btn-download { background-color: white; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-download:hover { background-color: #f5f5f7; }

        .btn-external { background-color: white; color: var(--secondary-accent); border: 1px solid var(--secondary-accent); }
        .btn-external:hover { background-color: #f4f4ff; }

        .copy-success { background-color: var(--success-color) !important; color: white !important; border-color: var(--success-color) !important; }

        /* --- WELCOME --- */
        #welcomeMessage { text-align: center; padding: 100px 0; color: var(--text-muted); }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            #menuToggle { display: flex !important; }
            aside { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 290px; }
            aside.active { transform: translateX(0); }
            #overlay.active { display: block; }
            .content-header { padding: 14px 20px; flex-wrap: wrap; gap: 8px; }
            .content-body { padding: 20px 20px; }
            .prompt-actions-bar { flex-wrap: wrap; gap: 8px; padding: 12px 14px; }
            button, .btn-link { justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleSidebar()"></div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>Prompt Library</h1>
            <div class="search-container">
                <span class="search-icon"><i data-lucide="search" size="16"></i></span>
                <input type="text" id="searchInput" placeholder="Cari judul atau isi prompt..." oninput="filterPrompts()">
            </div>
        </div>
        <div class="search-result-info" id="searchResultInfo"></div>
        <div class="prompt-list" id="promptList"></div>
    </aside>

    <main>
        <div class="content-header">
            <button id="menuToggle" onclick="toggleSidebar()" style="display:none;">
                <i data-lucide="menu" size="20"></i>
            </button>
            <div class="header-info">
                <h2 id="displayTitle">Pilih Prompt</h2>
            </div>
        </div>

        <div class="content-body">
            <div id="welcomeMessage">
                <div style="background: #f2f2f7; width: 80px; height: 80px; border-radius: 24px; display: flex; align-items: center; justify-content: justify-center; margin: 0 auto 24px;">
                    <i data-lucide="zap" size="40" style="color: var(--accent-color); margin: auto;"></i>
                </div>
                <h3 style="color: var(--text-main); margin-bottom: 8px;">Siap Bekerja?</h3>
                <p>Klik salah satu templat di samping untuk menyalin teks.</p>
            </div>

            <div id="mainContent" style="display: none;">
                <div class="guide-box">
                    <div class="guide-box-header">
                        <h3><i data-lucide="info" size="13"></i> Petunjuk Penggunaan</h3>
                        <!-- Switch bahasa dipindah ke sini, kontekstual di dekat konten -->
                        <div class="lang-toggle" id="langToggle">
                            <button class="lang-btn active" id="btnLangID" onclick="switchLang('id')">ID</button>
                            <button class="lang-btn" id="btnLangEN" onclick="switchLang('en')">EN</button>
                        </div>
                    </div>
                    <p id="displayGuide"></p>
                </div>

                <div class="prompt-container">
                    <div class="prompt-actions-bar" id="promptActionsBar">
                        <div class="no-translation-notice" id="noTranslationNotice">
                            <i data-lucide="alert-circle" size="13"></i>
                            Versi EN belum tersedia
                        </div>
                        <!-- Tombol-tombol eksternal dan unduhan dirender oleh JS -->
                        <div id="dynamicButtons" style="display:contents;"></div>
                        <button class="btn-copy" id="copyBtn" onclick="copyPrompt()">
                            <i data-lucide="copy" size="13"></i> Salin Prompt
                        </button>
                    </div>
                    <div class="prompt-text" id="displayPrompt"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
    // =====================================================================
    // PANDUAN MENAMBAH PROMPT BARU
    // =====================================================================
    //
    // Setiap entri di dalam promptData[] memiliki properti berikut:
    //
    //   id        : angka unik (integer), misalnya 1, 2, 3, ...
    //   title     : judul prompt (string)
    //   category  : nama kategori (string) — prompt dengan kategori sama
    //               otomatis dikelompokkan di sidebar
    //
    //   guide     : petunjuk penggunaan, bisa dua format:
    //               - string biasa  : "Petunjuk di sini..."
    //               - bilingual     : { id: "...", en: "..." }
    //
    //   content   : isi prompt, bisa dua format:
    //               - string biasa  : "Isi prompt di sini..."
    //               - bilingual     : { id: "...", en: "..." }
    //
    //   links     : (opsional) array tombol eksternal/aksi.
    //               Setiap tombol adalah objek dengan properti:
    //               - type  : "notebooklm" | "download_txt" | "custom" | "gemini_gem"
    //               - label : teks yang muncul di tombol
    //               - url   : URL tujuan (tidak diperlukan untuk "download_txt")
    //
    //               Tipe yang tersedia:
    //               ┌──────────────────┬──────────────────────────────────────┐
    //               │ "notebooklm"     │ Tombol biru-ungu → buka NotebookLM  │
    //               │ "gemini_gem"     │ Tombol biru-ungu → buka Gemini Gem  │
    //               │ "custom"         │ Tombol biru-ungu → URL bebas        │
    //               │ "download_txt"   │ Tombol putih → unduh prompt .txt    │
    //               └──────────────────┴──────────────────────────────────────┘
    //
    //               Contoh links dengan banyak tombol:
    //               links: [
    //                   { type: "notebooklm", label: "Buka NotebookLM",
    //                     url: "https://notebooklm.google.com/" },
    //                   { type: "custom", label: "Buka CustomGPT",
    //                     url: "https://chatgpt.com/g/..." },
    //                   { type: "gemini_gem", label: "Buka Gemini Gem",
    //                     url: "https://gemini.google.com/gems/..." },
    //                   { type: "download_txt", label: "Unduh TXT" }
    //               ]
    //
    //               Untuk menonaktifkan semua tombol, hapus properti links
    //               atau isi dengan array kosong: links: []
    //
    // CONTOH ENTRI PROMPT:
    //
    //     {
    //         id: 99,
    //         title: "Nama Prompt Saya",
    //         category: "Nama Kategori",
    //         guide: {
    //             id: `Petunjuk dalam bahasa Indonesia.`,
    //             en: `Instructions in English.`
    //         },
    //         content: {
    //             id: `Isi prompt dalam bahasa Indonesia.`,
    //             en: `Prompt content in English.`
    //         },
    //         links: [
    //             { type: "notebooklm", label: "Buka NotebookLM",
    //               url: "https://notebooklm.google.com/" },
    //             { type: "download_txt", label: "Unduh TXT" }
    //         ]
    //     },
    //
    // =====================================================================


    // =====================================================================
    // DATA PROMPT — edit bagian ini untuk menambah/mengubah prompt
    // =====================================================================
    const promptData = [
	

        // -----------------------------------------------------------------
        // KATEGORI: Bantuan untuk belajar aktif
        // -----------------------------------------------------------------
        {
            id: 2,
            title: "1. Si Tutor",
            category: "Bantuan untuk belajar aktif",
            guide: {
                id: `Salin templat prompt di bawah ini. Anda bisa menempelkannya di
- NotebookLM: Pilih (centang) sumber yang sesuai, lalu tempelkan prompt ini di kolom chat.
- Platform Chat AI: Unggah dokumen materi, lalu tempelkan prompt ini di kolom chat.

Templat ini digunakan untuk memahami materi secara mendalam melalui dialog interaktif dengan AI sebagai tutor.`,
                en: `Copy the prompt below. You can paste it in:
- NotebookLM: Select the relevant source, then paste into the chat.
- AI Chat Platform: Upload material, then paste this prompt.

This template is used to understand material deeply through interactive dialogue with AI as a tutor.`
            },
            content: {
                id: `Jadilah seorang tutor ahli yang sabar dan sistematis. Tugasmu adalah membantu saya memahami materi yang saya berikan secara mendalam melalui dialog interaktif.

Prinsip tutoring:
1. Mulai dari konsep dasar: Identifikasi dan jelaskan fondasi konseptual dari materi ini terlebih dahulu.
2. Bangun secara bertahap: Setiap penjelasan harus mengantar saya ke pemahaman yang lebih dalam, bukan melompat langsung ke konsep kompleks.
3. Gunakan analogi: Hubungkan konsep baru dengan hal yang sudah saya pahami menggunakan analogi yang tepat.
4. Verifikasi pemahaman: Setelah setiap penjelasan, ajukan satu pertanyaan reflektif untuk mengecek pemahaman saya sebelum melanjutkan.
5. Koreksi dengan konstruktif: Jika pemahaman saya keliru, tunjukkan di mana letak kekeliruannya dan bantu saya meluruskannya.
6. Penutup: Sesi dianggap selesai jika seluruh bagian materi telah kita bahas dan saya mampu menjawab pertanyaan integratif yang menggabungkan seluruh konsep tersebut.

Mari kita mulai. Perkenalkan topik utama dari materi ini dan jelaskan konsep dasarnya sebagai langkah pertama.`,
                en: `Be a patient and systematic expert tutor. Your task is to help me deeply understand the material I provide through interactive dialogue.

Tutoring principles:
1. Start from basics: Identify and explain the conceptual foundation of this material first.
2. Build gradually: Each explanation should lead me to deeper understanding, not jump straight to complex concepts.
3. Use analogies: Connect new concepts to things I already understand using appropriate analogies.
4. Verify understanding: After each explanation, pose one reflective question to check my comprehension before moving on.
5. Correct constructively: If my understanding is wrong, show where the error lies and help me correct it.
6. Closing: The session is considered complete when all parts of the material have been covered and I can answer integrative questions combining all concepts.

Let's begin. Introduce the main topic of this material and explain the basic concepts as the first step.`
            },
            links: [
            ]
        },

        {
            id: 3,
            title: "2. Si Gamer",
            category: "Bantuan untuk belajar aktif",
            guide: {
                id: `Salin templat prompt di bawah ini. Anda bisa menempelkannya di
- NotebookLM: Pilih (centang) sumber yang sesuai, lalu tempelkan prompt ini di kolom chat.
- Platform Chat AI: Unggah dokumen materi, lalu tempelkan prompt ini di kolom chat.

Templat ini digunakan untuk mengubah materi pelajaran menjadi pohon keterampilan (skill tree) ala game. Cocok untuk memahami urutan logika dari sebuah topik secara bertahap.`,
                en: `Copy the prompt below. You can paste it in:
- NotebookLM: Select the relevant source, then paste into the chat.
- AI Chat Platform: Upload material, then paste this prompt.

This template converts study material into a game-style skill tree. Great for understanding the logical sequence of a topic step by step.`
            },
            content: {
                id: `Jadilah seorang game designer sekaligus instructional designer. Tugasmu adalah mengubah seluruh informasi dalam materi yang saya berikan menjadi sebuah pohon keterampilan (skill tree) layaknya game MMORPG.

Langkah internal:
1. Analisis materi: Pindai materi yang tersedia. Identifikasi hubungan logis antarkonsep. 
2. Konstruksi nonlinear: Susunlah tepat empat skill utama. Urutan skill ini didasarkan pada prinsip prerequisite: Skill 1 adalah fondasi dasar, hingga Skill 4 sebagai "Ultimate Skill".
3. Struktur level: Jika sebuah skill memiliki cakupan luas, bagi menjadi beberapa level.
4. Beri nama tiap skill dengan istilah yang menarik dan relevan dengan tema materi.

Langkah interaksi:
1. Berikan peran unik untuk saya. Tampilkan daftar empat skill sebagai peta perjalanan.
2. Berikan nama untuk Skill 1, kompetensi yang harus dimiliki, dan materi singkat.
3. Akhiri setiap penjelasan level atau skill dengan sebuah "Quest" untuk menguji pemahaman.
4. Jika jawaban saya benar, nyatakan saya lulus ke level berikutnya. Jika salah, lakukan diagnostik.

Mulailah dengan menyambut saya dan sajikan peta perjalanan untuk menguasai Skill 1.`,
                en: `Be a game designer and instructional designer simultaneously. Your task is to transform all information in the material I provide into an MMORPG-style skill tree.

Internal steps:
1. Analyze material: Scan available material. Identify logical relationships between concepts.
2. Non-linear construction: Arrange exactly four main skills based on prerequisite principles: Skill 1 is the basic foundation, up to Skill 4 as the "Ultimate Skill."
3. Level structure: If a skill has broad coverage, divide it into multiple levels.
4. Name each skill with engaging terms relevant to the material's theme.

Interaction steps:
1. Give me a unique role. Display the four skills as my journey map.
2. Name Skill 1, the competencies required, and brief material overview.
3. End each level/skill explanation with a "Quest" to test understanding.
4. If my answer is correct, advance me to the next level. If wrong, run diagnostics.

Begin by welcoming me and presenting the journey map to master Skill 1.`
            },
            links: [
            ]
        },

        {
            id: 4,
            title: "3. Si Pelatih",
            category: "Bantuan untuk belajar aktif",
            guide: {
                id: `Salin templat prompt di bawah ini. Anda bisa menempelkannya di
- NotebookLM: Pilih (centang) sumber yang sesuai, lalu tempelkan prompt ini di kolom chat.
- Platform Chat AI: Unggah dokumen materi, lalu tempelkan prompt ini di kolom chat.

Templat ini digunakan untuk melatih penerapan konsep pada masalah yang kompleks.`,
                en: `Copy the prompt below. You can paste it in:
- NotebookLM: Select the relevant source, then paste into the chat.
- AI Chat Platform: Upload material, then paste this prompt.

This template trains applying concepts to complex problems.`
            },
            content: {
                id: `Bertindaklah sebagai pelatih ahli (expert coach) yang bertugas membimbing saya menguasai materi. Sesi ini menggunakan pendekatan fase Precision dan Integration dalam kerangka "Developing Talent" dari Benjamin Bloom.

Jalankan instruksi ini secara berurutan:
1. Fase presisi: Awali dengan memberikan satu skenario atau masalah terapan yang kompleks secara nonlinear. Pastikan skenarionya realistis dan relevan dengan dunia kerja.
2. Interaksi: Berhenti dan tunggu jawaban atau analisis saya.
3. Evaluasi secara presisi: Jadilah pelatih yang perfeksionis. Tunjukkan secara spesifik jika ada logika yang melompat, asumsi yang tidak berdasarkan materi, atau detail teknis yang terabaikan.
4. Perbaikan mandiri: Jika saya memberikan jawaban yang kurang presisi, minta saya memperbaikinya. Berikan petunjuk yang mengarah pada bagian tertentu di materi, tetapi jangan pernah memberikan jawaban akhir.
5. Fase integrasi: Setelah jawaban dinilai presisi, ubah satu atau dua variabel kunci dalam skenario tersebut. Minta saya menyesuaikan strategi.
6. Penutup: Sesi selesai apabila saya telah berhasil menyelesaikan tantangan adaptif dengan tingkat presisi tinggi.

Mari kita mulai. Sajikan skenario pertama berdasarkan materi yang ada.`,
                en: `Act as an expert coach guiding me to master the material. This session uses the Precision and Integration phases from Benjamin Bloom's "Developing Talent" framework.

Execute these instructions sequentially:
1. Precision phase: Start with one complex applied scenario or problem drawn nonlinearly. Ensure it's realistic and relevant to real-world practice.
2. Interaction: Stop and wait for my answer or analysis.
3. Precise evaluation: Be a perfectionist coach. Specifically point out any logical leaps, unsupported assumptions, or overlooked technical details.
4. Self-correction: If my answer lacks precision, ask me to revise it. Provide hints pointing to specific sections in the material, but never give the final answer.
5. Integration phase: Once my answer is deemed precise, change one or two key variables in the scenario. Ask me to adapt my strategy.
6. Closing: Session ends when I successfully complete the adaptive challenge with high precision.

Let's begin. Present the first scenario based on available material.`
            },
            links: [
            ]
        },

        {

    let activePrompt = null;

    // HELPERS

    function getContent(contentObj) {
        if (!contentObj) return '';
        if (typeof contentObj === 'string') return contentObj;
        return contentObj[activeLang] || contentObj['id'] || '';
    }

    function hasTranslation(contentObj) {
        if (!contentObj || typeof contentObj === 'string') return false;
        return !!(contentObj['en']);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightText(text, query) {
        if (!query) return escapeHtml(text);
        const escaped = escapeHtml(text);
        const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        return escaped.replace(new RegExp(escapedQuery, 'gi'), match => `<mark>${match}</mark>`);
    }

                btn.className = 'btn-download';
                btn.innerHTML = `<i data-lucide="${LINK_ICONS.download_txt}" size="13"></i> ${escapeHtml(linkDef.label || 'Unduh TXT')}`;
                btn.onclick = () => downloadPrompt();
                container.appendChild(btn);
            } else {
                const a = document.createElement('a');
                a.className = 'btn-link btn-external';
                a.href = linkDef.url || '#';
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                const icon = LINK_ICONS[linkDef.type] || 'external-link';
                a.innerHTML = `<i data-lucide="${icon}" size="13"></i> ${escapeHtml(linkDef.label || 'Buka')}`;
                container.appendChild(a);
            }
        });

        lucide.createIcons();
    }

    // =====================================================================
    // SIDEBAR RENDER
    // =====================================================================
    function renderSidebar() {
        const query = currentSearchQuery;
        let filtered = promptData;

        if (query) {
            filtered = filtered.filter(p => {
                const titleMatch = p.title.toLowerCase().includes(query);
                const catMatch = p.category.toLowerCase().includes(query);
                const c = p.content;
                const contentMatch = typeof c === 'string'
                    ? c.toLowerCase().includes(query)
                    : ((c && c.id || '').toLowerCase().includes(query) || (c && c.en || '').toLowerCase().includes(query));
                const g = p.guide;
                const guideMatch = typeof g === 'string'
                    ? g.toLowerCase().includes(query)
                    : ((g && g.id || '').toLowerCase().includes(query) || (g && g.en || '').toLowerCase().includes(query));
                return titleMatch || catMatch || contentMatch || guideMatch;
            });
        }

        const infoEl = document.getElementById('searchResultInfo');
        if (query) {
            infoEl.className = 'search-result-info visible';
            infoEl.textContent = `${filtered.length} prompt ditemukan`;
        } else {
            infoEl.className = 'search-result-info';
        }

        const listEl = document.getElementById('promptList');
        listEl.innerHTML = '';

        if (filtered.length === 0) {
            listEl.innerHTML = `<div style="padding: 24px 12px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">Tidak ada prompt yang cocok</div>`;
            lucide.createIcons();
            return;
        }

        const categories = [...new Set(filtered.map(p => p.category))];
        categories.forEach(cat => {
            const label = document.createElement('div');
            label.className = 'category-label';
            label.innerText = cat;
            listEl.appendChild(label);

            filtered.filter(p => p.category === cat).forEach(prompt => {
                const item = document.createElement('div');
                item.className = `prompt-item${activePrompt?.id === prompt.id ? ' active' : ''}`;
                item.innerHTML = query ? highlightText(prompt.title, query) : escapeHtml(prompt.title);
                item.onclick = () => selectPrompt(prompt);
                listEl.appendChild(item);
            });
        });

        lucide.createIcons();
    }

    // =====================================================================
    // SELECT PROMPT
    // =====================================================================
    function selectPrompt(prompt) {
        activePrompt = prompt;

        document.getElementById('welcomeMessage').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
        document.getElementById('displayTitle').innerText = prompt.title;

        updateLangToggle();
        document.getElementById('displayGuide').innerText = getContent(prompt.guide);
        renderDynamicButtons(prompt);
        renderPromptContent();

        if (window.innerWidth <= 768) toggleSidebar();
        renderSidebar();
    }

    // =====================================================================
    // LANGUAGE TOGGLE
    // =====================================================================
    function updateLangToggle() {
        const toggleEl = document.getElementById('langToggle');
        if (!activePrompt) { toggleEl.style.display = 'none'; return; }

        const hasEN = hasTranslation(activePrompt.content) || hasTranslation(activePrompt.guide);
        toggleEl.style.display = hasEN ? 'flex' : 'none';

        document.getElementById('btnLangID').classList.toggle('active', activeLang === 'id');
        document.getElementById('btnLangEN').classList.toggle('active', activeLang === 'en');
    }

    function switchLang(lang) {
        activeLang = lang;
        document.getElementById('btnLangID').classList.toggle('active', lang === 'id');
        document.getElementById('btnLangEN').classList.toggle('active', lang === 'en');
        if (activePrompt) {
            document.getElementById('displayGuide').innerText = getContent(activePrompt.guide);
            renderPromptContent();
        }
    }

    // =====================================================================
    // RENDER PROMPT CONTENT
    // =====================================================================
    function renderPromptContent() {
        if (!activePrompt) return;

        const contentText = getContent(activePrompt.content);
        const promptEl = document.getElementById('displayPrompt');

        if (currentSearchQuery) {
            promptEl.innerHTML = highlightText(contentText, currentSearchQuery);
        } else {
            promptEl.textContent = contentText;
        }

        const noTransEl = document.getElementById('noTranslationNotice');
        if (activeLang === 'en') {
            noTransEl.classList.toggle('visible', !hasTranslation(activePrompt.content));
        } else {
            noTransEl.classList.remove('visible');
        }

        lucide.createIcons();
    }

    // =====================================================================
    // SEARCH
    // =====================================================================
    function filterPrompts() {
        currentSearchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
        renderSidebar();
        if (activePrompt) renderPromptContent();
    }

    // =====================================================================
    // COPY / DOWNLOAD
    // =====================================================================
    function copyPrompt() {
        if (!activePrompt) return;
        const text = getContent(activePrompt.content);
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById('copyBtn');
            const originalContent = btn.innerHTML;
            btn.classList.add('copy-success');
            btn.innerHTML = `<i data-lucide="check" size="13"></i> Tersalin!`;
            lucide.createIcons();
            setTimeout(() => {
                btn.classList.remove('copy-success');
                btn.innerHTML = originalContent;
                lucide.createIcons();
            }, 2000);
        });
    }

    function downloadPrompt() {
        if (!activePrompt) return;
        const text = getContent(activePrompt.content);
        const filename = `${activePrompt.title}${activeLang === 'en' ? ' (EN)' : ''}.txt`;
        const element = document.createElement('a');
        const file = new Blob([text], { type: 'text/plain' });
        element.href = URL.createObjectURL(file);
        element.download = filename;
        document.body.appendChild(element);
        element.click();
        document.body.removeChild(element);
    }

    // =====================================================================
    // SIDEBAR TOGGLE (mobile)
    // =====================================================================
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    // =====================================================================
    // INIT
    // =====================================================================
    renderSidebar();
    lucide.createIcons();
    </script>
</body>
</html>
