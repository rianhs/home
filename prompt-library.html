<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fbfbfd;
            --sidebar-bg: #ffffff;
            --accent-color: #0071e3;
            --secondary-accent: #5e5ce6;
            --text-main: #1d1d1f;
            --text-muted: #6e6e73;
            --border-color: #d2d2d7;
            --success-color: #34c759;
            --code-bg: #f5f5f7;
        }

        /* --- GLOBAL STYLE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        aside {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-header { padding: 32px 24px 20px; }
        .sidebar-header h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 20px; }

        .search-container { position: relative; }
        .search-container input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border-radius: 12px;
            border: 1px solid transparent;
            background: #f2f2f7;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .search-container input:focus { background: #fff; border-color: var(--accent-color); box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }
        .search-container i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .prompt-list { flex: 1; overflow-y: auto; padding: 12px 16px; }
        .category-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; padding: 24px 12px 8px; }
        .prompt-item { padding: 14px 16px; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-bottom: 4px; font-size: 0.95rem; }
        .prompt-item:hover { background-color: #f5f5f7; }
        .prompt-item.active { background-color: var(--accent-color); color: white; font-weight: 500; box-shadow: 0 4px 12px rgba(0, 113, 227, 0.25); }

        /* --- MAIN CONTENT --- */
        main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: white; position: relative; }

        .content-header {
            position: sticky; top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            padding: 24px 48px;
            border-bottom: 1px solid rgba(210, 210, 215, 0.5);
            z-index: 50;
            display: flex; align-items: center;
        }

        #menuToggle { display: none; background: #f2f2f7; border: none; cursor: pointer; padding: 10px; border-radius: 10px; margin-right: 16px; color: var(--text-main); }

        .header-info h2 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.02em; }

        .content-body { padding: 48px; max-width: 1000px; width: 100%; margin: 0 auto; }

        #overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.2); z-index: 90; backdrop-filter: blur(4px); }

        /* Guide Box */
        .guide-box {
            background-color: #fff;
            padding: 24px;
            border-radius: 16px;
            margin-bottom: 32px;
            border: 1px solid var(--border-color);
        }
        .guide-box h3 { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .guide-box p { font-size: 1.05rem; line-height: 1.6; color: #3a3a3c; }

        /* Prompt Container & Roboto Mono */
        .prompt-container {
            background: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
        }
        .prompt-actions-bar {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 12px; padding: 14px 20px;
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
        }

        .prompt-text { 
            padding: 32px; 
            white-space: pre-wrap; 
            font-family: 'Roboto Mono', monospace; /* FONT MONOSPACE MODERN */
            font-size: 0.95rem; 
            line-height: 1.8; 
            color: #24292e; 
            background: #fff;
            letter-spacing: -0.01em;
        }

        /* Buttons Aesthetic */
        button, .btn-link {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 18px; border-radius: 12px; border: none;
            font-weight: 500; cursor: pointer; transition: all 0.2s ease; font-size: 0.85rem;
            text-decoration: none; font-family: 'Inter', sans-serif;
        }

        .btn-copy { background-color: var(--accent-color); color: white; }
        .btn-copy:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 113, 227, 0.3); }

        .btn-download { background-color: white; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-download:hover { background-color: #f5f5f7; }

        .btn-external { background-color: white; color: var(--secondary-accent); border: 1px solid var(--secondary-accent); }
        .btn-external:hover { background-color: #f4f4ff; }

        .copy-success { background-color: var(--success-color) !important; color: white !important; border-color: var(--success-color) !important; }

        /* --- MOBILE --- */
        @media (max-width: 768px) {
            #menuToggle { display: block; }
            aside { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); width: 290px; }
            aside.active { transform: translateX(0); }
            #overlay.active { display: block; }
            .content-header { padding: 16px 24px; }
            .content-body { padding: 24px; }
            .prompt-actions-bar { flex-direction: column; align-items: stretch; padding: 16px; }
            button, .btn-link { justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleSidebar()"></div>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h1>Prompt Library</h1>
            <div class="search-container">
                <i data-lucide="search" size="18"></i>
                <input type="text" id="searchInput" placeholder="Cari prompt..." oninput="filterPrompts()">
            </div>
        </div>
        <div class="prompt-list" id="promptList"></div>
    </aside>

    <main>
        <div class="content-header">
            <button id="menuToggle" onclick="toggleSidebar()">
                <i data-lucide="menu" size="22"></i>
            </button>
            <h2 id="displayTitle">Pilih Prompt</h2>
        </div>

        <div class="content-body">
            <div id="welcomeMessage" style="text-align: center; padding: 100px 0; color: var(--text-muted);">
                <div style="background: #f2f2f7; width: 80px; height: 80px; border-radius: 24px; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;">
                    <i data-lucide="zap" size="40" style="color: var(--accent-color);"></i>
                </div>
                <h3 style="color: var(--text-main); margin-bottom: 8px;">Siap Bekerja?</h3>
                <p>Klik salah satu templat di samping untuk menyalin teks.</p>
            </div>

            <div id="mainContent" style="display: none;">
                <div class="guide-box">
                    <h3><i data-lucide="info" size="14"></i> Petunjuk Penggunaan</h3>
                    <p id="displayGuide"></p>
                </div>

                <div class="prompt-container">
                    <div class="prompt-actions-bar">
                        <a id="displayLink" href="#" target="_blank" class="btn-link btn-external" style="display: none;">
                            <i data-lucide="external-link" size="14"></i> <span id="displayLinkLabel">Buka App</span>
                        </a>
                        <button class="btn-download" onclick="downloadPrompt()">
                            <i data-lucide="download" size="14"></i> TXT
                        </button>
                        <button class="btn-copy" id="copyBtn" onclick="copyPrompt()">
                            <i data-lucide="copy" size="14"></i> Salin Prompt
                        </button>
                    </div>
                    <div class="prompt-text" id="displayPrompt"></div>
                </div>
            </div>
        </div>
    </main>

        let activePrompt = null;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
        }

        function renderSidebar(data = promptData) {
            const listEl = document.getElementById('promptList');
            listEl.innerHTML = '';
            const categories = [...new Set(data.map(p => p.category))];
            categories.forEach(cat => {
                const label = document.createElement('div');
                label.className = 'category-label';
                label.innerText = cat;
                listEl.appendChild(label);
                data.filter(p => p.category === cat).forEach(prompt => {
                    const item = document.createElement('div');
                    item.className = `prompt-item ${activePrompt?.id === prompt.id ? 'active' : ''}`;
                    item.innerText = prompt.title;
                    item.onclick = () => selectPrompt(prompt);
                    listEl.appendChild(item);
                });
            });
            lucide.createIcons();
        }

        function selectPrompt(prompt) {
            activePrompt = prompt;
            document.getElementById('welcomeMessage').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('displayTitle').innerText = prompt.title;
            document.getElementById('displayGuide').innerText = prompt.guide;
            document.getElementById('displayPrompt').innerText = prompt.content;
            const linkBtn = document.getElementById('displayLink');
            if (prompt.link) {
                linkBtn.style.display = 'flex';
                linkBtn.href = prompt.link;
                document.getElementById('displayLinkLabel').innerText = prompt.linkLabel || "Buka App";
            } else { linkBtn.style.display = 'none'; }
            if (window.innerWidth <= 768) toggleSidebar();
            renderSidebar();
        }

        function filterPrompts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = promptData.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderSidebar(filtered);
        }

        function copyPrompt() {
            if (!activePrompt) return;
            navigator.clipboard.writeText(activePrompt.content).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalContent = btn.innerHTML;
                btn.classList.add('copy-success');
                btn.innerHTML = `<i data-lucide="check" size="14"></i> Tersalin!`;
                lucide.createIcons();
                setTimeout(() => { btn.classList.remove('copy-success'); btn.innerHTML = originalContent; lucide.createIcons(); }, 2000);
            });
        }

        function downloadPrompt() {
            if (!activePrompt) return;
            const element = document.createElement('a');
            const file = new Blob([activePrompt.content], {type: 'text/plain'});
            element.href = URL.createObjectURL(file);
            element.download = `${activePrompt.title}.txt`;
            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);
        }

        renderSidebar();
        lucide.createIcons();
    </script>
